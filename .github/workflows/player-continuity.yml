name: Player continuity (published baseline)

# Private evidence only: installs the PUBLISHED baseline player release, lets that real app create its own
# pairing, settings and history, then runs THIS candidate's installer (taken from an existing Windows run's
# artifact, no rebuild) over the data and proves the data survives. Dispatch, or a push to this branch (defaults = the Player 3.1.0 candidate run/head). No release, no tag, no main.
on:
  push:
    branches: [player-continuity-1125]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Windows workflow run id whose Zephyr-PC-installer artifact is the candidate'
        required: true
        type: string
      candidate_head:
        description: 'Full 40-char commit sha that run built'
        required: true
        type: string
      old_tag:
        description: 'Published release tag to start from'
        required: true
        default: 'player-v3.0.0'
        type: string
      old_asset:
        required: true
        default: 'Zephyr-PC-3.0.0.exe'
        type: string
      old_version:
        required: true
        default: '3.0.0'
        type: string
      old_sha256:
        description: 'Published asset sha256 (from the release API digest)'
        required: true
        default: '18e715d9f8235bca82de2183c6f62dd6707409451561da92817bcefbf47e6822'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  continuity:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Candidate installer from the Windows run artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '45756793630' }}
        run: |
          New-Item -ItemType Directory -Force windows/Output | Out-Null
          gh run download $env:CANDIDATE_RUN_ID -n Zephyr-PC-installer --dir windows/Output
          if ($LASTEXITCODE -ne 0) { throw "candidate artifact download exit $LASTEXITCODE" }
          $f = @(Get-ChildItem windows/Output -Filter 'Zephyr-PC-*.exe')
          if ($f.Count -ne 1) { throw "expected one candidate installer, found $($f.Count)" }
          $h = (Get-FileHash $f[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "candidate installer $($f[0].Name) sha256 $h"
          $h | Set-Content "$env:RUNNER_TEMP/player-installer-built-sha256.txt"
      - name: ffmpeg fixture
        run: choco install ffmpeg --no-progress -y
      - name: Published baseline real app-created data -> candidate
        shell: pwsh
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_TAG: ${{ inputs.old_tag || 'player-v3.0.0' }}
          OLD_ASSET: ${{ inputs.old_asset || 'Zephyr-PC-3.0.0.exe' }}
          OLD_VERSION: ${{ inputs.old_version || '3.0.0' }}
          OLD_SHA256: ${{ inputs.old_sha256 || '18e715d9f8235bca82de2183c6f62dd6707409451561da92817bcefbf47e6822' }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head || '55b935ba9ba622037c5fd12085df928171fa9d1a' }}
        run: |
          $f = @(Get-ChildItem windows/Output -Filter 'Zephyr-PC-*.exe')[0]
          $v = $f.BaseName -replace '^Zephyr-PC-',''
          ./scripts/pubbase_real_data.ps1 -OldTag $env:OLD_TAG -OldAsset $env:OLD_ASSET -OldVersion $env:OLD_VERSION -Candidate $f.FullName -OldSha256 $env:OLD_SHA256 -ExpectedVersion $v -ExpectedHead $env:CANDIDATE_HEAD
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-continuity-evidence
          path: |
            ${{ runner.temp }}/pubbase-real-data.txt
            ${{ runner.temp }}/pubbase-failure.png
            ${{ runner.temp }}/installer-hash-log.txt
          if-no-files-found: warn
