name: BingeMote capture only
on: workflow_dispatch
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Exact BingeMote capture source
        run: |
          git clone https://github.com/MtndaleRedneck/BingeMote.git /tmp/binge
          git -C /tmp/binge checkout ae1bda345d5f82ca67f03cad740bf155ca5cc3c1
      - name: Build only unchanged BingeMote release and capture test
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bingemote
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          cd /tmp/binge
          ./gradlew --no-daemon -PrecoveryReleaseTest assembleRelease assembleReleaseAndroidTest
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/binge-capture-only.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binge-capture-only
          path: |
            screenshots/*
            instrument-results/*
          retention-days: 2
