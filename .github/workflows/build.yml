name: Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'scripts/screenshots.sh'
      - 'scripts/instrumented.sh'
      - 'scripts/upgrade-prior.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      signed_upgrade:
        description: 'Also run the signed-upgrade job (real signed 1.5.0 release -> signed build of this ref)'
        type: boolean
        default: false

# Zephyr CI (public repo): unit tests, instrumented suites, screenshot rig.
# No release/publish job - no downloads while in development. Release signing
# uses the existing Android signer from encrypted repo secrets (never committed).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zephyr-Android-debug-apk
          path: android/build/outputs/apk/debug/*.apk

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/screenshots.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Zephyr-screenshots
          path: screenshots/*

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build the headless wire host (real server classes, Linux)
        run: dotnet build windows/ZephyrPlayer.HeadlessHost/ZephyrPlayer.HeadlessHost.csproj -c Release
      - name: Start the wire host + seed its library
        run: |
          mkdir -p /tmp/zephyr-wire-lib/Documentaries
          dd if=/dev/urandom of=/tmp/zephyr-wire-lib/"Wire Movie One (2024).mkv" bs=1k count=64
          dd if=/dev/urandom of=/tmp/zephyr-wire-lib/Documentaries/"Wire Doc.mkv" bs=1k count=16
          nohup dotnet run --project windows/ZephyrPlayer.HeadlessHost -c Release --no-build -- 47999 /tmp/zephyr-wire-lib > /tmp/wire-host.log 2>&1 &
          for i in $(seq 1 30); do grep -q PAIRCODE /tmp/wire-host.log && break; sleep 1; done
          cat /tmp/wire-host.log
          grep -q PAIRCODE /tmp/wire-host.log || { echo "wire host never came up"; exit 1; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Real emulator: StreamServer loopback (sockets), SAF listing, and the
      # inherited gesture/migration rigs - one class per fresh am instrument
      # session (see scripts/instrumented.sh for why a single session wedges).
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/instrumented.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: instrument-results
          path: instrument-results/*

  # Real upgrade check: the 1.5.0 release tag built as a debug app is installed and seeded with a paired
  # Zephyr state, then this build is installed OVER it (no uninstall) and the state and a cold open are verified.
  # Debug builds of both (same debug key); the signed-release upgrade is the separate dispatch-only signed-upgrade job below.
  upgrade-prior:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: new
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: zephyr-android-v1.5.0
          path: old
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - name: Build the prior release (debug) with the fixture test
        run: |
          cp new/android/src/androidTest/java/com/bingemote/ZephyrUpgradeFixtureTest.kt old/android/src/androidTest/java/com/bingemote/
          cp new/android/src/androidTest/java/com/bingemote/UpgradeConnectionTest.kt old/android/src/androidTest/java/com/bingemote/
          cd old && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          mkdir -p /tmp/up
          cp android/build/outputs/apk/debug/app-debug.apk /tmp/up/old-app.apk
          cp android/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/up/old-test.apk
      - name: Build this version (debug)
        run: |
          cd new && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          cp android/build/outputs/apk/debug/app-debug.apk /tmp/up/new-app.apk
          cp android/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/up/new-test.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: new
          script: bash scripts/upgrade-prior.sh

  # Real signed upgrade proof, dispatch only (never on push). Signs with the existing repo secrets exactly like
  # recovery-verification.yml. Installs the REAL published 1.5.0 asset (sha256 pinned below), seeds paired state with
  # the existing fixture through a test APK built from the 1.5.0 tag and signed with the same key, installs the signed
  # build of THIS ref over it with `install -r` (no uninstall), then runs the existing verify steps and cold open.
  # No signed APK and no key material is uploaded or printed; only instrument-results and public cert digests are.
  signed-upgrade:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_upgrade }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: new
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: zephyr-android-v1.5.0
          path: old
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - name: Real published 1.5.0 (sha256 pinned) and its commit
        run: |
          set -euo pipefail
          [ "$(git -C old rev-parse HEAD)" = efe4871ae70de537c2e56c8e9d27d75ede34e3e8 ] || { echo "old tag is not efe4871"; exit 1; }
          mkdir -p /tmp/up
          curl -sfL -o /tmp/up/old-app.apk https://github.com/MtndaleRedneck/Zephyr/releases/download/zephyr-android-v1.5.0/Zephyr-Android-1.5.0.apk
          echo "b4230632816f1cb39b669f5d111debfec1c9a4f894b4a709a581225528ebe0aa  /tmp/up/old-app.apk" | sha256sum -c
      - name: Build signed release + signed instrumentation APKs (old fixture at 1.5.0, new at this ref)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          cp new/android/src/androidTest/java/com/bingemote/ZephyrUpgradeFixtureTest.kt old/android/src/androidTest/java/com/bingemote/
          cp new/android/src/androidTest/java/com/bingemote/UpgradeConnectionTest.kt old/android/src/androidTest/java/com/bingemote/
          # The 1.5.0 tag has no testBuildType switch: add the same one-line switch to the CI checkout of the tag only (not committed).
          sed -i 's|^    compileSdk = 35$|    compileSdk = 35\n    testBuildType = "release"|' old/android/build.gradle.kts
          grep -q 'testBuildType = "release"' old/android/build.gradle.kts
          (cd old && ./gradlew --no-daemon -q assembleReleaseAndroidTest)
          cp old/android/build/outputs/apk/androidTest/release/*.apk /tmp/up/old-test.apk
          (cd new && ./gradlew --no-daemon -q -PsignedUpgradeTest assembleRelease assembleReleaseAndroidTest)
          cp new/android/build/outputs/apk/release/*.apk /tmp/up/new-app.apk
          cp new/android/build/outputs/apk/androidTest/release/*.apk /tmp/up/new-test.apk
      - name: Same signer on the real 1.5.0, the new build and both test APKs (public certificate digests only)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in old-app old-test new-app new-test; do
            out=$("$BT/apksigner" verify --print-certs /tmp/up/$f.apk)
            d=$(grep -m1 'certificate SHA-256 digest' <<<"$out" | awk '{print $NF}')
            [[ "$d" =~ ^[0-9a-f]{64}$ ]] || { echo "ASSERT FAIL: no valid signer digest for $f"; exit 1; }
            echo "$f signer sha256: $d"; echo "$d" >> /tmp/signers.txt
          done
          [ "$(wc -l < /tmp/signers.txt)" = 4 ] && [ "$(sort -u /tmp/signers.txt | wc -l)" = 1 ] || { echo "ASSERT FAIL: signer certificates differ"; exit 1; }
          echo "new-app sha256 (not uploaded): $(sha256sum /tmp/up/new-app.apk | cut -d' ' -f1)"
      - name: Diagnostic - methods the compiled fixture calls (informational, never fails the job)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in old-test new-test; do
            rm -rf /tmp/dx-$f && mkdir /tmp/dx-$f && unzip -q -o /tmp/up/$f.apk 'classes*.dex' -d /tmp/dx-$f || true
            echo "== $f: invoke targets inside ZephyrUpgradeFixtureTest (and its lambdas)"
            for d in /tmp/dx-$f/classes*.dex; do
              "$BT/dexdump" -d "$d" 2>/dev/null | awk '/\(in L[^;]*ZephyrUpgradeFixtureTest[^;]*;\)/{on=1;next} /\(in L/{on=0} on && /invoke-/{print $NF}' 
            done | sort | uniq -c | sort -rn || true
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: new
          script: UPGRADE_PKG=com.zephyr.remote bash scripts/upgrade-prior.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: signed-upgrade-results
          path: new/instrument-results/*
          retention-days: 2
