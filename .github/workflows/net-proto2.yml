name: net-proto2
on:
  push:
    branches: [tmp/net-proto2]
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: parse script with the PowerShell parser (nothing is executed)
        shell: pwsh
        run: |
          $tokens = $null
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/np2.ps1).Path, [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          'parse clean'
      - name: build prototype
        run: dotnet build proto -c Release
  probe:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        part: [abuse]
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: probe ${{ matrix.part }}
        timeout-minutes: 6
        shell: pwsh
        run: ./scripts/np2.ps1 -Part ${{ matrix.part }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: np2-${{ matrix.part }}
          path: out/*.txt
