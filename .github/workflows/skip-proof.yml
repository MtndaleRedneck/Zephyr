name: Targeted native and four-button proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seek:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release --filter "FullyQualifiedName~SkipPairPlaybackTests|FullyQualifiedName~SafeMediaSourceTests|FullyQualifiedName~Pair_StalledBody_HasDeadline|FullyQualifiedName~SecondaryHighlight_ReversesSelectedColor" --blame-hang --blame-hang-timeout 120s --logger "console;verbosity=detailed" --logger "trx;LogFileName=target-native.trx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: targeted-native-pixels
          path: |
            ${{ runner.temp }}/pc-secondary-highlight-*.png
            windows/ZephyrPlayer.Tests/TestResults/target-native.trx
