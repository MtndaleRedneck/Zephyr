name: Home visual confirmation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release -r win-x64 --self-contained -p:CaptureHook=true -o windows/capture-out
      - run: scripts/pc_desktop_capture.ps1 -HomeOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-visual-confirmation
          path: ${{ runner.temp }}/pc-home-library.png
