name: Bounded redesign diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Combined Home and native metadata tests, concurrency control
        shell: pwsh
        run: |
          dotnet build windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release
          '{"parallelizeTestCollections":false}' | Set-Content windows/ZephyrPlayer.Tests/bin/Release/net8.0-windows/xunit.runner.json
          foreach ($i in 1..3) {
            dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~HomeWindowRenderTests|FullyQualifiedName~LibraryDurationTests|FullyQualifiedName~PlaybackHistoryTests' --blame-crash --blame-crash-dump-type mini --results-directory "diagnostics/serial-$i" --logger trx --logger "console;verbosity=detailed"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Whole suite under same concurrency control
        run: dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release --no-build --blame-crash --blame-crash-dump-type mini --blame-hang --blame-hang-timeout 90s --results-directory diagnostics/full --logger trx --logger "console;verbosity=detailed"
      - name: Windows crash event records
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'Application Error|.NET Runtime|Windows Error Reporting' } | Format-List TimeCreated,ProviderName,Message | Out-File diagnostics/events.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-diagnostics
          path: diagnostics/**
