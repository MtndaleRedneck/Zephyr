name: Targeted native and four-button proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seek:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release --filter "FullyQualifiedName~SkipPairPlaybackTests|FullyQualifiedName~SafeMediaSourceTests|FullyQualifiedName~Pair_StalledBody_HasDeadline|FullyQualifiedName~SecondaryHighlight_ReversesSelectedColor" --blame-hang --blame-hang-timeout 120s --logger "console;verbosity=detailed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: targeted-native-pixels
          path: ${{ runner.temp }}/pc-secondary-highlight-*.png
