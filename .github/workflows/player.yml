name: Player
on:
  workflow_dispatch:
  push:
    branches: [player-rebuild-1124]
    paths:
      - 'windows/ZephyrPlayer/**'
      - 'windows/ZephyrPlayer.Tests/**'
      - '.github/workflows/player.yml'

# Zephyr Player rebuild branch: build and test on .NET 10. Nothing but the one-day lock-file
# artifact is uploaded (public repo: run artifacts are publicly downloadable).
permissions:
  contents: read
jobs:
  player:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore (regenerates the Player lock file when it is stale)
        run: dotnet restore windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -p:RestoreLockedMode=false --force-evaluate
      - name: Build Player
        run: dotnet build windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release --no-restore
      - name: Player tests
        if: always()
        timeout-minutes: 12
        run: >
          dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release
          --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type mini
          --logger "console;verbosity=normal"
      - name: Lock file for review (one day)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-lock
          path: windows/ZephyrPlayer/packages.lock.json
          retention-days: 1
