name: Back switch trace

# Zephyr Player 2.0 CP2 round 5: the real Back path repeated with the app's own ordering
# trace and an outside screen sampler on one clock. Evidence only; gates nothing.
# Runs on a push to zephyr-2.0 that touches the player, this file or its script
# (a workflow that exists only on this branch cannot be dispatched).
on:
  push:
    branches: [zephyr-2.0]
    paths:
      - '.github/workflows/back-switch-trace.yml'
      - 'scripts/back_switch_trace.ps1'
      - 'windows/ZephyrPlayer/**'
  workflow_dispatch:
    inputs:
      reps:
        description: 'Back clicks to trace'
        required: false
        default: '60'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Publish hooked capture build (CI-only seams, never shipped)
        timeout-minutes: 10
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/capture-out
      - name: Back handoff tests (targeted, the view-switch and caption tests beside them)
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release --filter "FullyQualifiedName~BackHandoffTests|FullyQualifiedName~ViewSwitch_LibraryStaysDrawnUntilPlayerHasContent|FullyQualifiedName~Caption_IsBlackOverThePlayer" --logger "trx;LogFileName=back-handoff.trx" --results-directory "$env:RUNNER_TEMP/backtrace/tests" --blame-hang --blame-hang-timeout 5m
          Copy-Item "$env:RUNNER_TEMP/cp2-unit-r5-*.txt" "$env:RUNNER_TEMP/backtrace/tests/" -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP/cp1-unit-view-switch.txt" "$env:RUNNER_TEMP/backtrace/tests/" -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP/handoff-mismatch-*" "$env:RUNNER_TEMP/backtrace/tests/" -ErrorAction SilentlyContinue
      - name: Back switch trace
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: scripts/back_switch_trace.ps1 -Reps ${{ github.event.inputs.reps || '60' }}
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: back-switch-trace
          path: ${{ runner.temp }}/backtrace/
          if-no-files-found: warn
