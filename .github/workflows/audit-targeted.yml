name: Audit targeted follow-up
on:
  workflow_dispatch:
    inputs:
      repair_tests:
        description: Run current Windows repair tests instead of old installer checks
        type: boolean
        default: false
      android_only:
        description: Skip already-proven Windows checks
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  installer-checks:
    if: ${{ !inputs.android_only && !inputs.repair_tests }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download exact tested installer, no rebuild
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force windows/Output | Out-Null
          gh run download 40893158780 --repo MtndaleRedneck/Zephyr-Dev --name Zephyr-PC-installer --dir windows/Output
          if ($LASTEXITCODE -ne 0) { throw 'exact candidate download failed' }
          $candidate = 'windows/Output/Zephyr-PC-1.3.0.exe'
          $hash = (Get-FileHash $candidate -Algorithm SHA256).Hash
          if ($hash -ne 'a9d2c808d9169e5dc3ef3b2a42446cb493e46de13abffdf55950042433257d13') { throw "wrong exact candidate installer: $hash" }
          Write-Output "EXACT_INSTALLER_SHA256=$hash"
      - name: Install + update continuity smoke (real installer)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        run: |
          # Actually INSTALL the artifact, not just build it: silent install,
          # auto-launch as the original user, verify the installed exe is
          # alive (its on-open update check runs in this window too), then
          # stop it so nothing holds the single-instance mutex.
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $installer = "windows/Output/Zephyr-PC-$v.exe"
          if (-not (Test-Path $installer)) { throw "installer missing: $installer" }
          $installLog = "$env:RUNNER_TEMP/installer-smoke.log"
          $ip = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$installLog" -PassThru
          if (-not $ip.WaitForExit(150000)) {
            Get-Content $installLog -Tail 80 -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match 'Zephyr|setup|netsh' } | Format-Table Id,ProcessName,MainWindowTitle
            throw "installer timed out; see installer-smoke.log"
          }
          if ($ip.ExitCode -ne 0) { Get-Content $installLog -Tail 60; throw "installer exit $($ip.ExitCode)" }
          $installed = "$env:LOCALAPPDATA\Programs\Zephyr Player\ZephyrPlayer.exe"
          if (-not (Test-Path $installed)) { throw "installed exe missing: $installed" }
          Write-Output "installed: $installed"
          # The per-user installer no longer adds firewall rules or the listen
          # permission (round-6 N-8): run the app's own setup step headless (the CI
          # runner is elevated, so the same code path the explained first-run
          # elevation takes just runs without the prompt) and verify its shape.
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $fw = Start-Process $installed -ArgumentList '--install-firewall',$sid -PassThru -Wait -WindowStyle Hidden
          if ($fw.ExitCode -ne 0) {
            Write-Host "passed SID: $sid"
            $aclAll = netsh http show urlacl | Out-String
            $block = ($aclAll -split "\r?\n\r?\n" | Where-Object { $_ -match ':47823/' } | Select-Object -First 1)
            Write-Host "47823 reservation after setup:"; Write-Host $block
            throw "--install-firewall exit $($fw.ExitCode)"
          }
          $tcp = netsh advfirewall firewall show rule name="Zephyr Player" verbose | Out-String
          if ($tcp -notmatch 'LocalPort:\s*47823') { throw 'TCP rule missing 47823' }
          if ($tcp -notmatch 'System') { throw 'TCP rule must scope program=System (http.sys attribution)' }
          if ($tcp -notmatch 'Private') { throw 'TCP rule must be Private-only' }
          if ($tcp -notmatch 'Local subnet|Localsubnet|localsubnet') { throw 'TCP rule must be LocalSubnet' }
          $udp = netsh advfirewall firewall show rule name="Zephyr Player Discovery" verbose | Out-String
          if ($udp -notmatch [regex]::Escape($installed.Replace('\','\')) -and $udp -notmatch 'ZephyrPlayer.exe') { throw 'UDP rule must scope the exe' }
          $acl = netsh http show urlacl | Out-String
          if ($acl -notmatch '47823') { throw 'URL ACL for 47823 missing' }
          # netsh stores well-known accounts as SDDL aliases (RID-500 admin -> "LA"):
          # compare parsed security descriptors, not the raw SID string.
          $block = ($acl -split "\r?\n\r?\n" | Where-Object { $_ -match ':47823/' } | Select-Object -First 1)
          $sddlMatch = [regex]::Match($block, 'SDDL:\s*(\S+)')
          $actualSddl = if ($sddlMatch.Success) { (New-Object System.Security.AccessControl.RawSecurityDescriptor($sddlMatch.Groups[1].Value)).GetSddlForm('All') } else { '' }
          $expectedSddl = (New-Object System.Security.AccessControl.RawSecurityDescriptor("D:(A;;GX;;;$sid)")).GetSddlForm('All')
          if ($actualSddl -ne $expectedSddl) { Write-Host "47823 reservation:"; Write-Host $block; Write-Host "expected SDDL: $expectedSddl"; throw 'URL ACL must scope the installing user SID' }
          Write-Output "firewall shape: TCP System/47823/Private/LocalSubnet, UDP exe/Private/LocalSubnet, ACL user SID - verified"
          # Negative-hook test on the SHIPPED binary (round-6 G6): even with the capture
          # env switch set, the shipped exe has no ci-capture-token compiled in, so the
          # hook token must be rejected like any other unknown token.
          $config = Join-Path $env:APPDATA 'ZephyrPlayer'
          New-Item -ItemType Directory -Force $config | Out-Null
          [IO.File]::WriteAllText((Join-Path $config 'paired.json'), '["local-smoke-token"]')
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $psi = [System.Diagnostics.ProcessStartInfo]::new($installed)
          $psi.UseShellExecute = $false
          $psi.Environment['ZEPHYR_CI_CAPTURE'] = '1'
          $neg = [System.Diagnostics.Process]::Start($psi)
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer local-smoke-token' } -TimeoutSec 2 -UseBasicParsing
              $ok = ($r.StatusCode -eq 200)
            } catch {}
          }
          if (-not $ok) { throw 'shipped exe never answered with its real paired token' }
          $negCode = 0
          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer ci-capture-token' } -TimeoutSec 3 -UseBasicParsing
            $negCode = [int]$r.StatusCode
          } catch { if ($_.Exception.Response) { $negCode = [int]$_.Exception.Response.StatusCode } }
          if ($negCode -ne 401) { throw "NEGATIVE HOOK FAILED: shipped exe answered ci-capture-token with $negCode, expected 401" }
          Write-Output 'NEGATIVE HOOK: PASS - shipped exe rejects ci-capture-token even with ZEPHYR_CI_CAPTURE=1'
          $neg.Kill()
          Start-Sleep -Seconds 2
          # The installer's runasoriginaluser auto-launch can take a while (or
          # not fire headless); poll first, direct-launch as fallback. A
          # mutex-handoff exit (second instance yields to the first) is FINE:
          # the verdict is "a ZephyrPlayer process is alive", not "my launch
          # survived".
          $alive = $false
          for ($i = 0; $i -lt 30 -and -not $alive; $i++) {
            Start-Sleep -Seconds 1
            $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)
          }
          if (-not $alive) {
            Write-Output "auto-launch did not produce a running app; launching installed exe directly"
            Start-Process $installed
            for ($i = 0; $i -lt 30 -and -not $alive; $i++) {
              Start-Sleep -Seconds 1
              $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)
            }
          }
          if (-not $alive) {
            $cl = Join-Path $env:TEMP 'ZephyrPlayer-crash.log'
            if (Test-Path $cl) { Write-Host "app crash log:"; Get-Content $cl }
            throw "installed exe never stayed running (startup/update-check crash or auto-launch dead)"
          }
          # Stay alive through the on-open update check window.
          Start-Sleep -Seconds 6
          if (-not (Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)) {
            $cl = Join-Path $env:TEMP 'ZephyrPlayer-crash.log'
            if (Test-Path $cl) { Write-Host "app crash log:"; Get-Content $cl }
            throw "installed exe died during the update-check window"
          }
          Write-Output "installed exe alive through launch + on-open update check window"
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Emulate updater handoff: app exits, installer replaces installed files,
          # then relaunches. No release/tag is published for this local smoke.
          $config = Join-Path $env:APPDATA 'ZephyrPlayer'
          New-Item -ItemType Directory -Force $config | Out-Null
          $settingsPath = Join-Path $config 'settings.json'
          $pairingPath = Join-Path $config 'paired.json'
          [IO.File]::WriteAllText($settingsPath, '{"SkipBackSeconds":10,"SkipForwardSeconds":60,"LastVolume":47}')
          [IO.File]::WriteAllText($pairingPath, '["local-smoke-token"]')
          $beforeSettings = (Get-FileHash $settingsPath).Hash
          $beforePairing = (Get-FileHash $pairingPath).Hash
          $updateLog = "$env:RUNNER_TEMP/installer-update-smoke.log"
          $up = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$updateLog" -PassThru
          if (-not $up.WaitForExit(150000)) { Get-Content $updateLog -Tail 50; throw 'replacement installer timed out' }
          if ($up.ExitCode -ne 0) { throw "replacement installer exit $($up.ExitCode)" }
          Start-Sleep -Seconds 8
          $running = Get-Process ZephyrPlayer -ErrorAction SilentlyContinue
          if (-not $running -or @($running | Where-Object { $_.Path -eq $installed }).Count -eq 0) { throw 'replacement did not relaunch installed app' }
          if ((Get-FileHash $settingsPath).Hash -ne $beforeSettings) { throw 'replacement changed settings' }
          # Startup may migrate the legacy token to DPAPI. Prove identity, not ciphertext bytes.
          $req = [System.Net.Http.HttpClient]::new()
          $req.DefaultRequestHeaders.Authorization = [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer','local-smoke-token')
          $auth = $req.GetAsync('http://127.0.0.1:47823/control/status').GetAwaiter().GetResult()
          if ([int]$auth.StatusCode -ne 200) { throw "replacement lost original pairing: $($auth.StatusCode)" }
          $req.DefaultRequestHeaders.Authorization = $null
          $noAuth = $req.GetAsync('http://127.0.0.1:47823/control/status').GetAwaiter().GetResult()
          if ([int]$noAuth.StatusCode -ne 401) { throw 'replacement accepted unauthenticated control' }
          $savedPairings = Get-Content $pairingPath -Raw | ConvertFrom-Json
          if (@($savedPairings).Count -ne 1) { throw 'replacement changed pairing count' }
          $storedToken = [string]$savedPairings[0].token
          if (-not $storedToken.StartsWith('dpapi:')) { throw 'replacement pairing was not protected at rest' }
          Add-Type -AssemblyName System.Security
          $decoded = [Text.Encoding]::UTF8.GetString([Security.Cryptography.ProtectedData]::Unprotect([Convert]::FromBase64String($storedToken.Substring(6)), $null, [Security.Cryptography.DataProtectionScope]::CurrentUser))
          if ($decoded -cne 'local-smoke-token') { throw 'replacement changed pairing identity' }
          $req.Dispose()
          if (-not (Test-Path (Join-Path (Split-Path $installed) 'libvlc'))) { throw 'installed libvlc directory missing' }
          Write-Output 'LOCAL_REINSTALL_CONTINUITY: PASS - installed path relaunched; settings hash unchanged; original pairing identity/count preserved, protected at rest, authenticated 200/unauthenticated 401. Same-version replacement, not published version upgrade.'
          # Report actual installed shortcut display names, never user paths.
          $shell = New-Object -ComObject WScript.Shell
          $desktopFolders = @([Environment]::GetFolderPath('Desktop'), "$env:PUBLIC/Desktop")
          foreach ($folder in $desktopFolders) {
            Get-ChildItem $folder -Filter '*.lnk' -ErrorAction SilentlyContinue | ForEach-Object {
              $target = $shell.CreateShortcut($_.FullName).TargetPath
              if ($target -match 'vlc.exe$|ZephyrPlayer.exe$') { Write-Output ("INSTALLED_SHORTCUT_LABEL: " + $_.BaseName) }
            }
          }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Legacy HKLM uninstall entry behavior proof (upgrade, setup declined)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Round-10 N10-4: what does the leftover 1.1.0 HKLM uninstall entry ACTUALLY
          # run after an upgrade where setup never completed (UAC declined/failed) -
          # which exe, which log, and does a foreign reservation survive going through
          # THAT entry. Empirical; nothing inferred from shared-folder assumptions.
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $priorUnins = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          if (Test-Path $priorUnins) {
            $pu = Start-Process $priorUnins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            $pu.WaitForExit(150000) | Out-Null
          }
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1') {
            Remove-Item $k -Recurse -Force -ErrorAction SilentlyContinue
          }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          gh run download 40413487207 -n Zephyr-PC-installer --dir "$env:RUNNER_TEMP/leg110"
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $newInstaller = "windows/Output/Zephyr-PC-$v.exe"
          $i1 = Start-Process "$env:RUNNER_TEMP/leg110/Zephyr-PC-1.1.0.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $i1.WaitForExit(150000)) { throw 'legacy leg: 1.1.0 install timed out' }
          if ($i1.ExitCode -ne 0) { throw "legacy leg: 1.1.0 install exit $($i1.ExitCode)" }
          $uninsPath = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          $stamp110 = (Get-Item $uninsPath).LastWriteTimeUtc
          $beforeEngineHash = (Get-FileHash $uninsPath -Algorithm SHA256).Hash
          Write-Output "UNINSTALL_ENGINE_BEFORE_SHA256=$beforeEngineHash"
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          # Upgrade; do NOT run setup - the UAC-declined/failed leg.
          $i2 = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $i2.WaitForExit(150000)) { throw 'legacy leg: upgrade install timed out' }
          if ($i2.ExitCode -ne 0) { throw "legacy leg: upgrade install exit $($i2.ExitCode)" }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          # The HKLM entry must STILL exist: no elevated setup ran to clear it.
          $entry = $null
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1') {
            if (Test-Path $k) { $entry = Get-ItemProperty $k; break }
          }
          if (-not $entry) { throw 'legacy leg: expected the 1.1.0 HKLM uninstall entry to STILL EXIST after a setup-declined upgrade' }
          $us = [string]$entry.UninstallString
          Write-Output "legacy HKLM UninstallString: $us"
          # Identity: the entry must target the shared unins000.exe. Engine bytes
          # may be unchanged; actual behavior below is the safety verdict.
          $target = $us.Trim() -replace '^"', '' -replace '".*$', '' -replace '\s+/.*$', ''
          if (-not (Test-Path $target)) { throw "legacy leg: entry target missing: $target" }
          $stampNew = (Get-Item $target).LastWriteTimeUtc
          Write-Output "unins000.exe stamps: after-1.1.0=$stamp110 entry-target=$stampNew"
          # Timestamp/hash are diagnostic. Actual legacy-entry behavior below is
          # the safety verdict; do not infer replacement from modification time.
          Write-Output "uninstaller engine metadata: $((Get-Item $target).VersionInfo.FileVersion)"
          $afterEngineHash = (Get-FileHash $target -Algorithm SHA256).Hash
          Write-Output "UNINSTALL_ENGINE_AFTER_SHA256=$afterEngineHash CHANGED=$($afterEngineHash -ne $beforeEngineHash)"
          if ((Resolve-Path $target).Path -ne (Resolve-Path $uninsPath).Path) { throw "legacy leg: entry target is not the shared uninstaller: $target" }
          # Behavior through THAT entry: plant a foreign reservation, invoke the path.
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh http add urlacl url=http://+:47823/ sddl="D:(A;;GX;;;SY)" | Out-Null
          $aclBefore = (netsh http show urlacl url=http://+:47823/) | Out-String
          $legLog = "$env:RUNNER_TEMP/uninstall-legacy-entry.log"
          $uu = Start-Process $target -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$legLog" -PassThru
          if (-not $uu.WaitForExit(150000)) { Get-Content $legLog -Tail 60 -ErrorAction SilentlyContinue; throw 'legacy leg: entry uninstaller timed out' }
          Start-Sleep -Seconds 3
          $aclAfter = (netsh http show urlacl url=http://+:47823/) | Out-String
          $norm = { param($t) ($t -replace '\s+', ' ').Trim() }
          if ((& $norm $aclAfter) -ne (& $norm $aclBefore)) {
            Write-Output "--- before ---`n$aclBefore`n--- after ---`n$aclAfter"
            Get-Content $legLog -Tail 80 -ErrorAction SilentlyContinue
            throw 'legacy leg: the foreign reservation did not survive the HKLM-entry uninstall byte-identical - the leftover entry IS a blind-delete path'
          }
          $legText = Get-Content $legLog -Raw -ErrorAction SilentlyContinue
          if ($legText -match 'http delete urlacl') { Get-Content $legLog -Tail 80; throw 'legacy leg: the blind delete EXECUTED through the HKLM entry' }
          foreach ($rid in 'delacl','delrule','deldiscrule') {
            if ($legText -notmatch ('Skipping RunOnceId\s*"?' + $rid)) { Get-Content $legLog -Tail 80; throw "legacy leg: no 'Skipping RunOnceId $rid' through the HKLM entry - suppression did not engage on this path" }
          }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          Write-Output 'LEGACY HKLM ENTRY: targets the shared post-upgrade unins000.exe; the foreign reservation survived byte-identical and every blind legacy id was skipped through this path too.'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-installer-checks
          path: |
            ${{ runner.temp }}/*smoke.log
            ${{ runner.temp }}/uninstall-legacy-entry.log
  windows-repairs:
    if: ${{ inputs.repair_tests }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Native repair and existing lease regressions
        run: dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release --filter "FullyQualifiedName~ZephyrPlayer.LeaseTests|FullyQualifiedName~ZephyrPlayer.Tests.CoreAudioTests.ComMetadata|FullyQualifiedName~ZephyrPlayer.Tests.CoreAudioTests.RealComActivation" --logger "trx;LogFileName=repair-tests.trx" --results-directory repair-results
      - name: Require actual targeted execution
        shell: pwsh
        run: |
          [xml]$trx = Get-Content repair-results/repair-tests.trx
          $c = $trx.TestRun.ResultSummary.Counters
          Write-Output "REPAIR_TRX total=$($c.total) executed=$($c.executed) passed=$($c.passed) failed=$($c.failed) notExecuted=$($c.notExecuted)"
          if ([int]$c.executed -lt 10 -or [int]$c.passed -lt 10 -or [int]$c.failed -ne 0 -or [int]$c.notExecuted -ne 0) { throw 'Targeted tests missing, skipped, or failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-windows-repairs
          path: repair-results/*
  stalled-pipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/audit-pipe-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-pipe-test
          path: audit-pipe-results/*
