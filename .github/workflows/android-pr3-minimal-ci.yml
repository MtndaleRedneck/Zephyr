# One-off, push-to-this-branch-only CI for the reviewed PR3 minimal caption+journal delta.
# Runs filtered JVM suites and compiles debug + androidTest. No release, tag, publish, secrets or artifacts of APKs.
name: Android PR3 minimal delta (compile + JVM)

on:
  push:
    branches: [ci/android-pr3-minimal-9951ccb]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Source binding (only this workflow file may differ from the reviewed proposal)
        run: |
          set -eu
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          test "$(git rev-parse 9951ccb60dc0aef132d126ddadba15e9ecba3a01^{tree})" = "0ea5a48be0f128edda3fc77edbd03dac5db424c8"
          d="$(git diff --name-status 9951ccb60dc0aef132d126ddadba15e9ecba3a01 HEAD)"
          echo "$d"
          test "$d" = "A	.github/workflows/android-pr3-minimal-ci.yml"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Filtered JVM unit tests
        run: >-
          ./gradlew --no-daemon testDebugUnitTest
          --tests 'com.bingemote.SubtitleCmdKeepDropTest'
          --tests 'com.bingemote.CommandQueueTest'
          --tests 'com.bingemote.CmdPolicyTest'
          --tests 'com.bingemote.SourceSwitchGuardTest'
      - name: Compile debug and androidTest (compile only, tests not run)
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr3-minimal-test-reports
          path: |
            android/build/reports/tests/
            android/build/test-results/
          if-no-files-found: warn
