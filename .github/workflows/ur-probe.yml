name: ur-probe
on:
  push:
    branches: [tmp/ur-probe]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 1 baseline and installer download
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          function Rules($tag) {
            $rows = Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.Direction -eq 'Inbound' } | ForEach-Object {
              $a = $_ | Get-NetFirewallApplicationFilter -ErrorAction SilentlyContinue
              $p = $_ | Get-NetFirewallPortFilter -ErrorAction SilentlyContinue
              [pscustomobject]@{ Name=$_.Name; Display=$_.DisplayName; Enabled=$_.Enabled; Profile=$_.Profile; Action=$_.Action; Program=$a.Program; Proto=$p.Protocol; LocalPort=($p.LocalPort -join ','); Group=$_.Group }
            }
            $rows | Export-Csv "out/rules-$tag.csv" -NoTypeInformation
            $rows | Where-Object { ($_.Display + $_.Program + $_.Name) -match 'unified|remoteserver|urserver|9512|9511' } | Format-List | Out-String | Tee-Object "out/ur-rules-$tag.txt"
            "inbound rule count ($tag): $($rows.Count)"
          }
          Get-NetConnectionProfile | Format-List Name,InterfaceAlias,NetworkCategory | Out-String | Tee-Object out/00-env.txt -Append
          Rules 'before'
          Invoke-WebRequest -Uri 'https://www.unifiedremote.com/download/windows-setup' -OutFile out/ur-setup.exe -MaximumRedirection 5 -UseBasicParsing
          (Get-FileHash out/ur-setup.exe -Algorithm SHA256).Hash | Tee-Object out/01-installer.txt -Append
          $sig = Get-AuthenticodeSignature out/ur-setup.exe; "signature: $($sig.Status) $($sig.SignerCertificate.Subject)" | Tee-Object out/01-installer.txt -Append
      - name: 2 silent install (bounded; the installer may launch the server at its end, so no -Wait on the process tree)
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          function Rules($tag) {
            $rows = Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.Direction -eq 'Inbound' } | ForEach-Object {
              $a = $_ | Get-NetFirewallApplicationFilter -ErrorAction SilentlyContinue
              $p = $_ | Get-NetFirewallPortFilter -ErrorAction SilentlyContinue
              [pscustomobject]@{ Name=$_.Name; Display=$_.DisplayName; Enabled=$_.Enabled; Profile=$_.Profile; Action=$_.Action; Program=$a.Program; Proto=$p.Protocol; LocalPort=($p.LocalPort -join ','); Group=$_.Group }
            }
            $rows | Export-Csv "out/rules-$tag.csv" -NoTypeInformation
            $rows | Where-Object { ($_.Display + $_.Program + $_.Name) -match 'unified|remoteserver|urserver|9512|9511' } | Format-List | Out-String | Tee-Object "out/ur-rules-$tag.txt"
            "inbound rule count ($tag): $($rows.Count)"
          }
          $p = Start-Process out/ur-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          $done = $p.WaitForExit(240000); "installer exited within 240s: $done exit=$(if($done){$p.ExitCode})" | Tee-Object out/02-install.txt -Append
          Start-Sleep 20
          Get-Process | Where-Object { $_.Name -match 'RemoteServer|Unified|urserver|ServerSetup|ur-setup' } | Format-Table Name,Id,Path | Out-String -Width 200 | Tee-Object out/02-install.txt -Append
          Get-ChildItem "${env:ProgramFiles(x86)}\Unified Remote 3","$env:ProgramFiles\Unified Remote 3" -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 200 | Tee-Object out/02-install.txt -Append
      - name: 3 services, tasks, startup entries and rules after install and launch
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          function Rules($tag) {
            $rows = Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.Direction -eq 'Inbound' } | ForEach-Object {
              $a = $_ | Get-NetFirewallApplicationFilter -ErrorAction SilentlyContinue
              $p = $_ | Get-NetFirewallPortFilter -ErrorAction SilentlyContinue
              [pscustomobject]@{ Name=$_.Name; Display=$_.DisplayName; Enabled=$_.Enabled; Profile=$_.Profile; Action=$_.Action; Program=$a.Program; Proto=$p.Protocol; LocalPort=($p.LocalPort -join ','); Group=$_.Group }
            }
            $rows | Export-Csv "out/rules-$tag.csv" -NoTypeInformation
            $rows | Where-Object { ($_.Display + $_.Program + $_.Name) -match 'unified|remoteserver|urserver|9512|9511' } | Format-List | Out-String | Tee-Object "out/ur-rules-$tag.txt"
            "inbound rule count ($tag): $($rows.Count)"
          }
          Get-Service | Where-Object { $_.Name -match 'unified' -or $_.DisplayName -match 'unified' } | Format-Table Name,Status,StartType | Out-String | Tee-Object out/03-run.txt -Append
          Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -match 'unified' } | Format-Table TaskName,State | Out-String | Tee-Object out/03-run.txt -Append
          foreach ($k in 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run','HKCU:\Software\Microsoft\Windows\CurrentVersion\Run') { (Get-ItemProperty $k -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Value -match 'Unified' } | ForEach-Object { "startup: $($_.Name) = $($_.Value)" } | Tee-Object out/03-run.txt -Append }
          $exe = Get-ChildItem "${env:ProgramFiles(x86)}\Unified Remote 3","$env:ProgramFiles\Unified Remote 3" -Filter RemoteServerWin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe -and -not (Get-Process RemoteServerWin -ErrorAction SilentlyContinue)) { Start-Process $exe.FullName; "started server manually (installer had not launched it)" | Tee-Object out/03-run.txt -Append }
          Start-Sleep 40
          $ids = (Get-Process | Where-Object { $_.Name -match 'RemoteServer|urserver|Unified' }).Id
          Get-Process | Where-Object { $ids -contains $_.Id } | Format-Table Name,Id,SessionId,Path | Out-String -Width 200 | Tee-Object out/03-run.txt -Append
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess } | Format-Table LocalAddress,LocalPort,OwningProcess | Out-String | Tee-Object out/03-run.txt -Append
          Get-NetUDPEndpoint -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess } | Format-Table LocalAddress,LocalPort,OwningProcess | Out-String | Tee-Object out/03-run.txt -Append
          Rules 'after-run'
      - name: 4 settings keys (auth, encryption, bind), values redacted for secrets
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          function Rules($tag) {
            $rows = Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.Direction -eq 'Inbound' } | ForEach-Object {
              $a = $_ | Get-NetFirewallApplicationFilter -ErrorAction SilentlyContinue
              $p = $_ | Get-NetFirewallPortFilter -ErrorAction SilentlyContinue
              [pscustomobject]@{ Name=$_.Name; Display=$_.DisplayName; Enabled=$_.Enabled; Profile=$_.Profile; Action=$_.Action; Program=$a.Program; Proto=$p.Protocol; LocalPort=($p.LocalPort -join ','); Group=$_.Group }
            }
            $rows | Export-Csv "out/rules-$tag.csv" -NoTypeInformation
            $rows | Where-Object { ($_.Display + $_.Program + $_.Name) -match 'unified|remoteserver|urserver|9512|9511' } | Format-List | Out-String | Tee-Object "out/ur-rules-$tag.txt"
            "inbound rule count ($tag): $($rows.Count)"
          }
          foreach ($d in "$env:ProgramData\Unified Remote","$env:APPDATA\Unified Remote","$env:LOCALAPPDATA\Unified Remote") {
            if (Test-Path $d) {
              "-- $d" | Tee-Object out/04-config.txt -Append
              Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 200000 -and $_.Extension -match '\.(json|xml|ini|cfg|conf|txt)$' -and $_.FullName -notmatch '\\Remotes\\' } | Select-Object -First 30 | ForEach-Object {
                "file: $($_.FullName.Replace($d,'.')) ($($_.Length) B)" | Tee-Object out/04-config.txt -Append
                Select-String -Path $_.FullName -Pattern 'password|auth|encrypt|require|bind|interface|network|firewall|public|private|wan' | Select-Object -First 25 | ForEach-Object { $l = ($_.Line.Trim() -replace '("?(password|pass|secret|token|key)"?\s*[:=]\s*)"?[^",\s]+', '$1<redacted>'); $l.Substring(0, [Math]::Min(200, $l.Length)) } | Tee-Object out/04-config.txt -Append
              }
            }
          }
          $a = Import-Csv out/rules-before.csv; $b = Import-Csv out/rules-after-run.csv
          $new = $b | Where-Object { $n = $_.Name; -not ($a | Where-Object Name -eq $n) }
          "-- new inbound rules before -> after-run: $(@($new).Count)" | Tee-Object out/05-diff.txt -Append
          $new | Format-List Display,Enabled,Profile,Action,Program,Proto,LocalPort | Out-String | Tee-Object out/05-diff.txt -Append
      - name: 5 where settings live, registry keys, and what the listening ports answer (loopback only, passive)
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          "== all files under its data and install folders (name, size)" | Tee-Object out/06-files.txt -Append
          foreach ($d in "$env:ProgramData\Unified Remote","$env:APPDATA\Unified Remote","$env:LOCALAPPDATA\Unified Remote","${env:ProgramFiles(x86)}\Unified Remote 3") {
            if (Test-Path $d) { "-- $d" | Tee-Object out/06-files.txt -Append
              Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\Remotes\\' -and $_.Extension -notmatch '\.(dll|png|ico|exe|msg|dat)$' } | Select-Object -First 80 | ForEach-Object { "$($_.FullName.Replace($d,'.'))  $($_.Length)" } | Tee-Object out/06-files.txt -Append } }
          "== registry under Unified keys (secret-like values redacted)" | Tee-Object out/07-registry.txt -Append
          foreach ($k in 'HKCU:\Software\Unified Intents','HKCU:\Software\Unified Remote','HKLM:\SOFTWARE\Unified Intents','HKLM:\SOFTWARE\WOW6432Node\Unified Intents','HKLM:\SOFTWARE\WOW6432Node\Unified Remote') {
            if (Test-Path $k) { "-- $k" | Tee-Object out/07-registry.txt -Append
              Get-ChildItem $k -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $key = $_; "[$($key.Name)]"; $key.GetValueNames() | ForEach-Object { $v = $key.GetValue($_); if ($_ -match 'pass|secret|token|key') { $v = '<redacted>' }; "  $_ = $v" } } | Select-Object -First 80 | Tee-Object out/07-registry.txt -Append } }
          "== text-like settings anywhere in its folders (auth words only, values redacted)" | Tee-Object out/08-settings.txt -Append
          foreach ($d in "$env:ProgramData\Unified Remote","$env:APPDATA\Unified Remote","$env:LOCALAPPDATA\Unified Remote") {
            Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 100000 -and $_.FullName -notmatch '\\Remotes\\' } | Select-Object -First 40 | ForEach-Object {
              $txt = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($_.FullName))
              $m = [regex]::Matches($txt, '(?i)[\w\-]{0,30}(password|passwd|auth|encrypt|require|bind|discover|public|private)[\w\-]{0,30}\W{1,4}[^\n,}]{0,40}') | Select-Object -First 15
              if ($m) { "file: $($_.Name)"; $m | ForEach-Object { ($_.Value -replace '(?i)((password|passwd|secret|token)\W{1,4}).*', '$1<redacted>') } } } | Tee-Object out/08-settings.txt -Append }
          "== binary strings in RemoteServerWin.exe that look like setting names (cap 60)" | Tee-Object out/09-strings.txt -Append
          $exe = "${env:ProgramFiles(x86)}\Unified Remote 3\RemoteServerWin.exe"
          $b = [IO.File]::ReadAllBytes($exe); $t = [Text.Encoding]::ASCII.GetString($b)
          [regex]::Matches($t, '(?i)[ -~]{3,60}') | Where-Object { $_.Value -match '(?i)(password|require.?auth|authentication|encrypt|allow.?(remote|wan|public)|bind|discover)' } | Select-Object -Unique -First 60 -ExpandProperty Value | Tee-Object out/09-strings.txt -Append
          "== loopback answers (nothing sent, then a plain HTTP GET)" | Tee-Object out/10-ports.txt -Append
          foreach ($port in 9512, 9510) {
            try { $c = New-Object Net.Sockets.TcpClient('127.0.0.1', $port); $s = $c.GetStream(); $s.ReadTimeout = 3000; $buf = New-Object byte[] 256
              try { $n = $s.Read($buf, 0, 256); "port $port speaks first: $n bytes: $([BitConverter]::ToString($buf,0,[Math]::Min($n,48)))" } catch { "port $port: server sends nothing unprompted (3 s)" }
              $req = [Text.Encoding]::ASCII.GetBytes("GET / HTTP/1.0`r`n`r`n"); $s.Write($req,0,$req.Length); $s.ReadTimeout = 3000
              try { $n = $s.Read($buf, 0, 256); "port $port after GET: $n bytes: $([Text.Encoding]::ASCII.GetString($buf,0,[Math]::Min($n,120)) -replace '[^ -~]','.')" } catch { "port $port after GET: no answer (3 s)" }
              $c.Close() } catch { "port $port connect failed: $($_.Exception.Message)" } } | Tee-Object out/10-ports.txt -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ur-probe
          path: |
            out/*.txt
            out/*.csv
          retention-days: 2
