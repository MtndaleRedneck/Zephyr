name: PC 2.0.1 proof

# Focused evidence for Ezzy's Nov 1 list (Zephyr PC 2.0.1): the new/changed unit and
# render tests, then a real-desktop run of the hooked CI build on a real library of
# H.264 and HEVC MKVs (thumbnails, path bar, phone pill, Settings scroll, full-screen
# flash sampling). The full release gate stays windows.yml (dispatched separately).

on:
  # A workflow that is not on the default branch cannot be dispatched, so this one
  # runs on pushes to the 2.0.1 branch.
  push:
    branches: [zephyr-2.0.1]
    paths:
      - 'windows/ZephyrPlayer/**'
      - 'windows/ZephyrPlayer.Tests/**'
      - 'scripts/pc_201_proof.ps1'
      - '.github/workflows/pc-201-proof.yml'

permissions:
  contents: read

concurrency:
  group: pc-201-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # candidate = this commit; baseline = the released 2.0.0 player (tag commit b3ce4e9)
        # through the same proof script, so each check is shown failing on the old code.
        leg: [candidate, baseline]
    env:
      APP_REF: ${{ matrix.leg == 'baseline' && 'b3ce4e9893c7f7c5d56a009532ff49e9c808e6e5' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Baseline player source (only when app_ref is set)
        if: ${{ matrix.leg == 'baseline' }}
        shell: pwsh
        run: |
          git checkout $env:APP_REF -- windows/ZephyrPlayer
          git log -1 --format='baseline player source from %H %s' $env:APP_REF
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install ffmpeg (builds the real MKV library)
        run: choco install ffmpeg --no-progress -y
      - name: Focused tests (2.0.1 items + render evidence at 96/120/144/192 dpi)
        if: ${{ matrix.leg == 'candidate' }}
        id: tests
        timeout-minutes: 15
        run: >
          dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release
          --filter "FullyQualifiedName~VlcThumbs|FullyQualifiedName~RedesignRender|FullyQualifiedName~Cp1Shell|FullyQualifiedName~SkipPairUi|FullyQualifiedName~Cp2Player|FullyQualifiedName~HomeWindowRender|FullyQualifiedName~Ver201"
          --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type mini
          --logger "trx;LogFileName=proof-tests.trx"
          --logger "console;verbosity=normal"
      - name: Publish hooked capture build (CI-only seam compiled in - never shipped)
        if: always()
        timeout-minutes: 10
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/capture-out
      - name: Real-desktop proof (real MKVs, full-screen flash sampling)
        if: always()
        timeout-minutes: 12
        shell: pwsh
        run: scripts/pc_201_proof.ps1 -Label "${{ matrix.leg }} ${{ matrix.leg == 'baseline' && 'b3ce4e9 (2.0.0)' || github.sha }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc-201-proof-${{ matrix.leg }}
          path: |
            ${{ runner.temp }}/proof201/
            ${{ runner.temp }}/pc-redesign-*.png
            ${{ runner.temp }}/thumb-*.png
            ${{ runner.temp }}/ver201-*.png
            windows/ZephyrPlayer.Tests/TestResults/
          if-no-files-found: warn
