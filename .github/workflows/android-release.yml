name: Android release candidate

# Real-signer release candidate for the Zephyr phone app. Dispatch-only: the
# real signer never runs in ordinary push CI and the signed APK is never a raw
# public artifact (sealed with the candidate keypair like recovery-verification).
# After clearance: dispatch this with the cleared ref, download the sealed
# artifact, decrypt with the candidate private key, check SHA256SUMS, then
# attach the APK to the release. This workflow creates no release itself.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Cleared commit or tag to build'
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bingemote
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify signer and version
        # The update path breaks if the cert differs from the shipped APKs.
        run: |
          set -euo pipefail
          APK=android/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" | grep -o "versionName='[^']*'" | head -1
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q "2d15b89bf5fec3f558570e80a44bd0a93526c507b6e3982abf43865ae65b62f9" certs.txt
      - name: Seal the signed candidate (never a raw artifact)
        run: |
          set -euo pipefail
          APK=android/build/outputs/apk/release/app-release.apk
          mkdir -p sealed
          openssl rand -out "$RUNNER_TEMP/transport.key" 32
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$APK" -out sealed/zephyr-android-release.apk.enc -pass file:"$RUNNER_TEMP/transport.key"
          openssl pkeyutl -encrypt -certin -inkey scripts/candidate-public.pem -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/transport.key" -out sealed/key.enc
          sha256sum "$APK" > sealed/SHA256SUMS
          rm -f "$RUNNER_TEMP/transport.key"
      - uses: actions/upload-artifact@v4
        with:
          name: zephyr-android-release-candidate
          path: sealed/*
          retention-days: 2
