name: Subtitle position reference

# Evidence only (Zephyr Player 2.0 CP2 round 4): where real VLC desktop 3.0.24 draws an
# embedded subtitle vs Zephyr Player as it is vs plain libVLC defaults, same clips, same
# picture sizes. Changes nothing in Zephyr. Runs when this file or its script changes.
on:
  push:
    branches: [zephyr-2.0]
    paths:
      - '.github/workflows/subtitle-position-reference.yml'
      - 'scripts/subtitle_position_reference.ps1'
      - 'scripts/subref/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reference:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Publish hooked capture build (CI-only status seam, never shipped)
        timeout-minutes: 10
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/capture-out
      - name: Build the plain libVLC reference harness
        timeout-minutes: 8
        run: dotnet build scripts/subref/SubRef.csproj -c Release -o scripts/subref/out
      - name: Reference capture (VLC desktop, Zephyr, libVLC defaults)
        timeout-minutes: 15
        shell: pwsh
        run: scripts/subtitle_position_reference.ps1
      - name: Upload reference frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subtitle-position-reference
          path: ${{ runner.temp }}/subref/
          if-no-files-found: warn
