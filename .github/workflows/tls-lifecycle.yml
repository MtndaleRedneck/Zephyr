name: TLS lifecycle (Windows)
on:
  workflow_dispatch:
  push:
    branches: [tls-lifecycle-test-1127]
    paths:
      - 'windows/ZephyrVlcRemote/HelperTls.cs'
      - 'windows/ZephyrVlcRemote.Tests/HelperTlsWindowsIntegrationTests.cs'
      - '.github/workflows/tls-lifecycle.yml'

# Short-lived test branch only. Runs on a GitHub-hosted standard runner (free on a public repo, no private minutes).
# Exercises elevated setup, http.sys binding, loopback handshake, unelevated readiness, and ownership-checked removal
# on a disposable machine and a private test port. Uploads nothing (public repo: artifacts are public).

permissions:
  contents: read

jobs:
  tls:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.x
      - name: Build tests
        run: dotnet build windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release
      - name: Elevated lifecycle tests (admin runner)
        env:
          ZEPHYR_TLS_INTEGRATION: '1'
        run: dotnet test windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~HelperTlsWindowsIntegrationTests&FullyQualifiedName~ElevatedSetup' --logger "console;verbosity=normal"
      - name: Leave a ready identity for the unelevated check
        env:
          ZEPHYR_TLS_INTEGRATION: '1'
        shell: pwsh
        run: |
          # Setup only (no removal): the elevated test removes at its end, so run setup again through the public entry point.
          $env:ZEPHYR_TLS_SETUP_ONLY = '1'
          dotnet test windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~HelperTlsWindowsIntegrationTests.SetupOnlyLeavesReadyIdentity'
      - name: Unelevated readiness (standard local user)
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString ([guid]::NewGuid().ToString('N') + 'aA1!') -AsPlainText -Force
          New-LocalUser -Name tlsstd -Password $pw -NoPassword:$false | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential('.\tlsstd', $pw)
          $root = (Get-Location).Path
          icacls $root /grant 'tlsstd:(OI)(CI)RX' /T /C | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'std.txt'; New-Item $out -ItemType File | Out-Null
          icacls $out /grant 'tlsstd:M' | Out-Null
          $dotnet = (Get-Command dotnet).Source
          $p = Start-Process -FilePath $dotnet -WorkingDirectory $root -Credential $cred -LoadUserProfile -PassThru -Wait -NoNewWindow `
            -ArgumentList @('test','windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj','-c','Release','--no-build','--filter','FullyQualifiedName~StandardUserRuntimeReadsReadyState') `
            -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          Get-Content $out | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "standard-user readiness failed ($($p.ExitCode))" }
        env:
          ZEPHYR_TLS_STDUSER: '1'
      - name: Cleanup (always)
        if: always()
        shell: pwsh
        run: |
          netsh http delete sslcert ipport=0.0.0.0:47993 | Out-Null
          netsh http delete sslcert ipport=[::]:47993 | Out-Null
          Remove-LocalUser -Name tlsstd -ErrorAction SilentlyContinue
