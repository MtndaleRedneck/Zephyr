name: TLS lifecycle (Windows)
on:
  workflow_dispatch:
  push:
    branches: [tls-lifecycle-test-1127]
    paths:
      - 'windows/ZephyrVlcRemote/HelperTls.cs'
      - 'windows/ZephyrVlcRemote.Tests/HelperTlsWindowsIntegrationTests.cs'
      - '.github/workflows/tls-lifecycle.yml'

# Short-lived test branch only. Runs on a GitHub-hosted standard runner (free on a public repo, no private minutes).
# Exercises elevated setup, http.sys binding, loopback handshake, unelevated readiness, and ownership-checked removal
# on a disposable machine and a private test port. Uploads nothing (public repo: artifacts are public).

permissions:
  contents: read

jobs:
  tls:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.x
      - name: Build tests
        run: dotnet build windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release
      - name: Prepare sentinel folder
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'sentinels'
          New-Item -ItemType Directory -Path $d | Out-Null
          "SENTINELS=$d" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Elevated lifecycle and foreign-binding tests (admin runner)
        shell: pwsh
        env:
          ZEPHYR_TLS_INTEGRATION: '1'
        run: |
          $env:ZEPHYR_TLS_SENTINEL_DIR = $env:SENTINELS
          dotnet test windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release --no-build `
            --filter 'FullyQualifiedName~HelperTlsWindowsIntegrationTests.ElevatedSetup|FullyQualifiedName~HelperTlsWindowsIntegrationTests.ForeignBinding' `
            --logger "trx;LogFileName=elevated.trx" --results-directory "$env:RUNNER_TEMP/trx"
          if ($LASTEXITCODE -ne 0) { throw "elevated tests failed" }
          foreach ($n in 'elevated-lifecycle','foreign-binding') { if (-not (Test-Path "$env:SENTINELS/$n.txt")) { throw "sentinel missing: $n (test did not run its body)" } }
          [xml]$t = Get-Content "$env:RUNNER_TEMP/trx/elevated.trx"
          $c = $t.TestRun.ResultSummary.Counters
          if ([int]$c.executed -ne 2 -or [int]$c.passed -ne 2 -or [int]$c.notExecuted -ne 0) { throw "expected exactly 2 executed and 2 passed, 0 skipped" }
      - name: Leave a ready identity (admin, setup only)
        shell: pwsh
        env:
          ZEPHYR_TLS_INTEGRATION: '1'
          ZEPHYR_TLS_SETUP_ONLY: '1'
        run: |
          $env:ZEPHYR_TLS_SENTINEL_DIR = $env:SENTINELS
          dotnet test windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~HelperTlsWindowsIntegrationTests.SetupOnlyLeavesReadyIdentity'
          if ($LASTEXITCODE -ne 0) { throw "setup-only failed" }
          if (-not (Test-Path "$env:SENTINELS/setup-only.txt")) { throw "sentinel missing: setup-only" }
      - name: Unelevated readiness (standard local user)
        shell: pwsh
        run: |
          $plain = [guid]::NewGuid().ToString('N') + 'aA1!'
          Write-Output "::add-mask::$plain"
          $pw = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name tlsstd -Password $pw | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential('.\tlsstd', $pw)
          $root = (Get-Location).Path
          icacls $root /grant 'tlsstd:(OI)(CI)RX' /T /C | Out-Null
          icacls $env:SENTINELS /grant 'tlsstd:(OI)(CI)M' | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'std.txt'; New-Item $out -ItemType File | Out-Null
          icacls $out /grant 'tlsstd:M' | Out-Null
          $trx = Join-Path $env:RUNNER_TEMP 'trx-std'; New-Item -ItemType Directory -Path $trx | Out-Null
          icacls $trx /grant 'tlsstd:(OI)(CI)M' | Out-Null
          $dotnet = (Get-Command dotnet).Source
          $args = @('test','windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj','-c','Release','--no-build',
            '--filter','FullyQualifiedName~HelperTlsWindowsIntegrationTests.StandardUserRuntimeReadsReadyState',
            '--logger','trx;LogFileName=std.trx','--results-directory',$trx,
            '-e','ZEPHYR_TLS_STDUSER=1','-e','ZEPHYR_TLS_EXPECT_USER=tlsstd','-e',"ZEPHYR_TLS_SENTINEL_DIR=$env:SENTINELS")
          $p = Start-Process -FilePath $dotnet -WorkingDirectory $root -Credential $cred -LoadUserProfile -PassThru -Wait -NoNewWindow -ArgumentList $args -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          Get-Content $out | Select-Object -Last 40
          Get-Content "$out.err" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "standard-user child failed ($($p.ExitCode))" }
          $s = Get-Content "$env:SENTINELS/standard-user.txt" -ErrorAction Stop
          if ($s -notmatch 'user=tlsstd;admin=False;ready=True') { throw "standard-user sentinel does not prove an unelevated ready read" }
          [xml]$t = Get-Content "$trx/std.trx"
          $c = $t.TestRun.ResultSummary.Counters
          if ([int]$c.executed -ne 1 -or [int]$c.passed -ne 1 -or [int]$c.notExecuted -ne 0) { throw "expected exactly 1 executed and 1 passed, 0 skipped" }
      - name: Cleanup (always)
        if: always()
        shell: pwsh
        run: |
          netsh http delete sslcert ipport=0.0.0.0:47993 | Out-Null
          netsh http delete sslcert ipport=[::]:47993 | Out-Null
          Remove-LocalUser -Name tlsstd -ErrorAction SilentlyContinue
