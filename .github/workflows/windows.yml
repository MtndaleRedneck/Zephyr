name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'scripts/pc_desktop_capture.ps1'
      - 'scripts/vlc_remote_e2e.ps1'
      - 'scripts/vlc_http_proof.ps1'
      - 'scripts/range_server.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# Windows player: build, tests, real-VLC proof, installer, desktop captures.
# Runs only when Windows-side files change.
# Evidence steps (proof/publish/installer/captures) run even when tests fail,
# so UI pixels and the installer are never held hostage by a test regression.
# The overall job still fails when tests fail: evidence is not the gate.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vlc-remote-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish helper exe (with the CI-only pairing hook)
        run: dotnet publish windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/ZephyrVlcRemote/out

      # The movies test launches real VLC; install it as its own step so a mirror hiccup is visible.
      - name: Install VLC (for the movies launch test)
        run: choco install vlc --no-progress -y
      - name: Install ffmpeg (makes the long clip for the end-to-end resume case)
        run: choco install ffmpeg --no-progress -y

      - name: Publish the clean release exe (no CI hooks - the build that ships)
        run: dotnet publish windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o windows/ZephyrVlcRemote/release-out

      # The installer is built ONLY from the clean release build - the hooked test exe
      # (out/) never reaches an artifact. The e2e proves the installed build ignores
      # ZEPHYR_VLC_REMOTE_PAIR_CODE before any runtime test runs.
      - name: Build the installer from the clean release build
        run: |
          choco install innosetup --no-progress -y
          $v = Select-String -Path windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "/DMySourceDir=release-out" windows/ZephyrVlcRemote/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      # Round-9 R9-2 follow-up: compile-out proof, not just convention - the SHIPPED
      # binary must not contain the CI hook strings at all, and the hooked one must
      # (proves the hooked exe really is the hooked build the e2e drives).
      - name: Hook compile-out proof (shipped exe has no CI seams)
        shell: pwsh
        run: |
          $clean = "windows/ZephyrVlcRemote/release-out/ZephyrVlcRemote.exe"
          $hooked = "windows/ZephyrVlcRemote/out/ZephyrVlcRemote.exe"
          $cleanText = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($clean)) + [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($clean))
          $hookedText = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($hooked)) + [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($hooked))
          foreach ($needle in 'firewall-shape-ok','ZEPHYR_VLC_REMOTE_PAIR_CODE','window-shot') {
            if ($cleanText.Contains($needle)) { throw "clean release exe contains CI hook string '$needle' - the seam is not compiled out" }
            if (-not $hookedText.Contains($needle)) { throw "hooked exe is missing '$needle' - wrong build published to out/" }
          }
          Write-Output 'compile-out proof: shipped exe has no CI hook strings; hooked exe has them.'

      - name: Render the helper window for layout review (CI only)
        run: |
          dotnet publish windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/ZephyrVlcRemote/shot
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\window.png"
          & windows/ZephyrVlcRemote/shot/ZephyrVlcRemote.exe --window-shot
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\window-pairing-expired.png"
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = "pairing-expired"
          & windows/ZephyrVlcRemote/shot/ZephyrVlcRemote.exe --window-shot
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\window-pairing.png"
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = "pairing"
          & windows/ZephyrVlcRemote/shot/ZephyrVlcRemote.exe --window-shot
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\window-broken-store.png"
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = "broken-store"
          & windows/ZephyrVlcRemote/shot/ZephyrVlcRemote.exe --window-shot
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\dialog-remove.png"
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = "remove"
          & windows/ZephyrVlcRemote/shot/ZephyrVlcRemote.exe --window-shot
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\dialog-remove-all.png"
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = "remove-all"
          & windows/ZephyrVlcRemote/shot/ZephyrVlcRemote.exe --window-shot
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\tray-menu.png"
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = "tray"
          & windows/ZephyrVlcRemote/shot/ZephyrVlcRemote.exe --window-shot
          Remove-Item Env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE

      # Round-9 missing-captures: the Player permission dialogs with REAL interaction
      # state - hover/pressed from the real cursor parked over the primary button,
      # focus from real keyboard focus. Behavior proof for the N9-7 template fix.
      - name: Render the Player permission dialogs with real states (CI only)
        run: |
          dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/ZephyrPlayer/shot
          foreach ($m in 'explain','hover','pressed','focus','note') {
            & windows/ZephyrPlayer/shot/ZephyrPlayer.exe --dialog-shot $m "$PWD\windows\ZephyrPlayer\dialog-$m.png"
            if ($LASTEXITCODE -ne 0) { throw "dialog-shot $m exit $LASTEXITCODE" }
            if (-not (Test-Path "windows/ZephyrPlayer/dialog-$m.png")) { throw "dialog-shot $m wrote no PNG" }
          }

      - name: Upload the window shot
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-VLC-Remote-window
          path: |
            windows/ZephyrVlcRemote/window*.png
            windows/ZephyrVlcRemote/dialog-*.png
            windows/ZephyrVlcRemote/tray-menu.png
            windows/ZephyrVlcRemote/window-diag.txt
            windows/ZephyrPlayer/dialog-*.png
          if-no-files-found: warn

      - name: Helper runtime tests (migration, pairing, endpoints, discovery identity, firewall)
        run: pwsh -File scripts/vlc_remote_e2e.ps1

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Zephyr Player
        timeout-minutes: 8
        run: dotnet build windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release
      - name: Build Zephyr VLC Remote helper
        timeout-minutes: 8
        run: dotnet build windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -c Release
      - name: Windows test suite (blame-hang bounded; no silent host)
        # Independent suites: a red in one never skips the other - both results are collected.
        if: always()
        id: tests
        timeout-minutes: 10
        run: >
          dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release
          --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type mini
          --logger "trx;LogFileName=win-tests.trx"
          --logger "console;verbosity=detailed"
      - name: Zephyr VLC Remote test suite
        # Independent suites: a red in one never skips the other - both results are collected.
        if: always()
        id: zvrtests
        timeout-minutes: 10
        run: >
          dotnet test windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release
          --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type mini
          --logger "trx;LogFileName=zvr-tests.trx"
      - name: Upload test diagnostics (TRX + hang dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            windows/ZephyrPlayer.Tests/TestResults/
            ${{ runner.temp }}/sta-error-*.txt
          if-no-files-found: warn
      - name: Real VLC network playback proof (phone->VLC route)
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: scripts/vlc_http_proof.ps1
      - name: Publish single-file exe
        if: always()
        timeout-minutes: 8
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o windows/out
      - name: Build installer (Inno Setup)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Publish hooked capture build (CI-only seam compiled in - never shipped)
        if: always()
        timeout-minutes: 8
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/capture-out
      - name: Real-desktop capture (hooked CI build - the shipped exe has no capture token)
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: scripts/pc_desktop_capture.ps1
      - name: Install + update continuity smoke (real installer)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        run: |
          # Actually INSTALL the artifact, not just build it: silent install,
          # auto-launch as the original user, verify the installed exe is
          # alive (its on-open update check runs in this window too), then
          # stop it so nothing holds the single-instance mutex.
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $installer = "windows/Output/Zephyr-PC-$v.exe"
          if (-not (Test-Path $installer)) { throw "installer missing: $installer" }
          $installLog = "$env:RUNNER_TEMP/installer-smoke.log"
          $ip = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$installLog" -PassThru
          if (-not $ip.WaitForExit(150000)) {
            Get-Content $installLog -Tail 80 -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match 'Zephyr|setup|netsh' } | Format-Table Id,ProcessName,MainWindowTitle
            throw "installer timed out; see installer-smoke.log"
          }
          if ($ip.ExitCode -ne 0) { Get-Content $installLog -Tail 60; throw "installer exit $($ip.ExitCode)" }
          $installed = "$env:LOCALAPPDATA\Programs\Zephyr Player\ZephyrPlayer.exe"
          if (-not (Test-Path $installed)) { throw "installed exe missing: $installed" }
          Write-Output "installed: $installed"
          # The per-user installer no longer adds firewall rules or the listen
          # permission (round-6 N-8): run the app's own setup step headless (the CI
          # runner is elevated, so the same code path the explained first-run
          # elevation takes just runs without the prompt) and verify its shape.
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $fw = Start-Process $installed -ArgumentList '--install-firewall',$sid -PassThru -Wait -WindowStyle Hidden
          if ($fw.ExitCode -ne 0) {
            Write-Host "passed SID: $sid"
            $aclAll = netsh http show urlacl | Out-String
            $block = ($aclAll -split "\r?\n\r?\n" | Where-Object { $_ -match ':47823/' } | Select-Object -First 1)
            Write-Host "47823 reservation after setup:"; Write-Host $block
            throw "--install-firewall exit $($fw.ExitCode)"
          }
          $tcp = netsh advfirewall firewall show rule name="Zephyr Player" verbose | Out-String
          if ($tcp -notmatch 'LocalPort:\s*47823') { throw 'TCP rule missing 47823' }
          if ($tcp -notmatch 'System') { throw 'TCP rule must scope program=System (http.sys attribution)' }
          if ($tcp -notmatch 'Private') { throw 'TCP rule must be Private-only' }
          if ($tcp -notmatch 'Local subnet|Localsubnet|localsubnet') { throw 'TCP rule must be LocalSubnet' }
          $udp = netsh advfirewall firewall show rule name="Zephyr Player Discovery" verbose | Out-String
          if ($udp -notmatch [regex]::Escape($installed.Replace('\','\')) -and $udp -notmatch 'ZephyrPlayer.exe') { throw 'UDP rule must scope the exe' }
          $acl = netsh http show urlacl | Out-String
          if ($acl -notmatch '47823') { throw 'URL ACL for 47823 missing' }
          # netsh stores well-known accounts as SDDL aliases (RID-500 admin -> "LA"):
          # compare parsed security descriptors, not the raw SID string.
          $block = ($acl -split "\r?\n\r?\n" | Where-Object { $_ -match ':47823/' } | Select-Object -First 1)
          $sddlMatch = [regex]::Match($block, 'SDDL:\s*(\S+)')
          $actualSddl = if ($sddlMatch.Success) { (New-Object System.Security.AccessControl.RawSecurityDescriptor($sddlMatch.Groups[1].Value)).GetSddlForm('All') } else { '' }
          $expectedSddl = (New-Object System.Security.AccessControl.RawSecurityDescriptor("D:(A;;GX;;;$sid)")).GetSddlForm('All')
          if ($actualSddl -ne $expectedSddl) { Write-Host "47823 reservation:"; Write-Host $block; Write-Host "expected SDDL: $expectedSddl"; throw 'URL ACL must scope the installing user SID' }
          Write-Output "firewall shape: TCP System/47823/Private/LocalSubnet, UDP exe/Private/LocalSubnet, ACL user SID - verified"
          # Negative-hook test on the SHIPPED binary (round-6 G6): even with the capture
          # env switch set, the shipped exe has no ci-capture-token compiled in, so the
          # hook token must be rejected like any other unknown token.
          $config = Join-Path $env:APPDATA 'ZephyrPlayer'
          New-Item -ItemType Directory -Force $config | Out-Null
          [IO.File]::WriteAllText((Join-Path $config 'paired.json'), '["local-smoke-token"]')
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $psi = [System.Diagnostics.ProcessStartInfo]::new($installed)
          $psi.UseShellExecute = $false
          $psi.Environment['ZEPHYR_CI_CAPTURE'] = '1'
          $neg = [System.Diagnostics.Process]::Start($psi)
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer local-smoke-token' } -TimeoutSec 2 -UseBasicParsing
              $ok = ($r.StatusCode -eq 200)
            } catch {}
          }
          if (-not $ok) { throw 'shipped exe never answered with its real paired token' }
          $negCode = 0
          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer ci-capture-token' } -TimeoutSec 3 -UseBasicParsing
            $negCode = [int]$r.StatusCode
          } catch { if ($_.Exception.Response) { $negCode = [int]$_.Exception.Response.StatusCode } }
          if ($negCode -ne 401) { throw "NEGATIVE HOOK FAILED: shipped exe answered ci-capture-token with $negCode, expected 401" }
          Write-Output 'NEGATIVE HOOK: PASS - shipped exe rejects ci-capture-token even with ZEPHYR_CI_CAPTURE=1'
          $neg.Kill()
          Start-Sleep -Seconds 2
          # The installer's runasoriginaluser auto-launch can take a while (or
          # not fire headless); poll first, direct-launch as fallback. A
          # mutex-handoff exit (second instance yields to the first) is FINE:
          # the verdict is "a ZephyrPlayer process is alive", not "my launch
          # survived".
          $alive = $false
          for ($i = 0; $i -lt 30 -and -not $alive; $i++) {
            Start-Sleep -Seconds 1
            $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)
          }
          if (-not $alive) {
            Write-Output "auto-launch did not produce a running app; launching installed exe directly"
            Start-Process $installed
            for ($i = 0; $i -lt 30 -and -not $alive; $i++) {
              Start-Sleep -Seconds 1
              $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)
            }
          }
          if (-not $alive) {
            $cl = Join-Path $env:TEMP 'ZephyrPlayer-crash.log'
            if (Test-Path $cl) { Write-Host "app crash log:"; Get-Content $cl }
            throw "installed exe never stayed running (startup/update-check crash or auto-launch dead)"
          }
          # Stay alive through the on-open update check window.
          Start-Sleep -Seconds 6
          if (-not (Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)) {
            $cl = Join-Path $env:TEMP 'ZephyrPlayer-crash.log'
            if (Test-Path $cl) { Write-Host "app crash log:"; Get-Content $cl }
            throw "installed exe died during the update-check window"
          }
          Write-Output "installed exe alive through launch + on-open update check window"
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Emulate updater handoff: app exits, installer replaces installed files,
          # then relaunches. No release/tag is published for this local smoke.
          $config = Join-Path $env:APPDATA 'ZephyrPlayer'
          New-Item -ItemType Directory -Force $config | Out-Null
          $settingsPath = Join-Path $config 'settings.json'
          $pairingPath = Join-Path $config 'paired.json'
          [IO.File]::WriteAllText($settingsPath, '{"SkipBackSeconds":10,"SkipForwardSeconds":60,"LastVolume":47}')
          [IO.File]::WriteAllText($pairingPath, '["local-smoke-token"]')
          $beforeSettings = (Get-FileHash $settingsPath).Hash
          $beforePairing = (Get-FileHash $pairingPath).Hash
          $updateLog = "$env:RUNNER_TEMP/installer-update-smoke.log"
          $up = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$updateLog" -PassThru
          if (-not $up.WaitForExit(150000)) { Get-Content $updateLog -Tail 50; throw 'replacement installer timed out' }
          if ($up.ExitCode -ne 0) { throw "replacement installer exit $($up.ExitCode)" }
          Start-Sleep -Seconds 8
          $running = Get-Process ZephyrPlayer -ErrorAction SilentlyContinue
          if (-not $running -or @($running | Where-Object { $_.Path -eq $installed }).Count -eq 0) { throw 'replacement did not relaunch installed app' }
          if ((Get-FileHash $settingsPath).Hash -ne $beforeSettings) { throw 'replacement changed settings' }
          if ((Get-FileHash $pairingPath).Hash -ne $beforePairing) { throw 'replacement changed pairing' }
          if (-not (Test-Path (Join-Path (Split-Path $installed) 'libvlc'))) { throw 'installed libvlc directory missing' }
          Write-Output 'LOCAL_REINSTALL_CONTINUITY: PASS - installed path relaunched; settings and pairing hashes unchanged. Same-version replacement, not published version upgrade.'
          # Report actual installed shortcut display names, never user paths.
          $shell = New-Object -ComObject WScript.Shell
          $desktopFolders = @([Environment]::GetFolderPath('Desktop'), "$env:PUBLIC/Desktop")
          foreach ($folder in $desktopFolders) {
            Get-ChildItem $folder -Filter '*.lnk' -ErrorAction SilentlyContinue | ForEach-Object {
              $target = $shell.CreateShortcut($_.FullName).TargetPath
              if ($target -match 'vlc.exe$|ZephyrPlayer.exe$') { Write-Output ("INSTALLED_SHORTCUT_LABEL: " + $_.BaseName) }
            }
          }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Published 1.1.0 -> new build upgrade smoke (real artifacts)
        if: always()
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The remaining "nothing forces reinstall/re-pair" leg, proven with the
          # REAL published artifact: install player-v1.1.0 from the release feed,
          # run it, seed exact 1.1.0-format state (formats verified against the
          # 1.1.0 source), upgrade with THIS build's installer, then prove the
          # phone's old-format pairing token still authorizes a real control call.
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Round-9 T1: this leg must be a CLEAN 1.1.0 machine. The earlier continuity
          # step installed THIS build into the same folder first, so 1.1.0 would append
          # to a 1.2-born uninstall log - not the real upgrade path. Uninstall it and
          # clear the folder so 1.1.0's own log is the only one.
          $priorUnins = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          if (Test-Path $priorUnins) {
            $pu = Start-Process $priorUnins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            if (-not $pu.WaitForExit(150000)) { throw 'pre-cleanup uninstaller timed out' }
          }
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          gh release download player-v1.1.0 -p Zephyr-PC-1.1.0.exe --dir "$env:RUNNER_TEMP/old110" --clobber
          $oldInstaller = "$env:RUNNER_TEMP/old110/Zephyr-PC-1.1.0.exe"
          if (-not (Test-Path $oldInstaller)) { throw "published 1.1.0 installer missing after download" }
          $oldLog = "$env:RUNNER_TEMP/installer-old110.log"
          $op = Start-Process $oldInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$oldLog" -PassThru
          if (-not $op.WaitForExit(150000)) { Get-Content $oldLog -Tail 60 -ErrorAction SilentlyContinue; throw 'published 1.1.0 installer timed out' }
          if ($op.ExitCode -ne 0) { Get-Content $oldLog -Tail 60 -ErrorAction SilentlyContinue; throw "published 1.1.0 installer exit $($op.ExitCode)" }
          $installed = "$env:LOCALAPPDATA\Programs\Zephyr Player\ZephyrPlayer.exe"
          if (-not (Test-Path $installed)) { throw "1.1.0 installed exe missing: $installed" }
          # Let the real 1.1.0 app run once (its own startup path creates its config).
          $alive = $false
          for ($i = 0; $i -lt 30 -and -not $alive; $i++) { Start-Sleep -Seconds 1; $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue) }
          if (-not $alive) { Start-Process $installed; for ($i = 0; $i -lt 30 -and -not $alive; $i++) { Start-Sleep -Seconds 1; $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue) } }
          if (-not $alive) { throw 'published 1.1.0 never stayed running after install' }
          Write-Output 'published 1.1.0 installed and ran'
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Round-9 N9-6: the Player's UNELEVATED old-shape rejection, headless on the
          # hooked build (the shipped exe has no hook): 1.1.0's rules must fail the
          # live check BEFORE any migration runs.
          $hooked = "windows/capture-out/ZephyrPlayer.exe"
          if (-not (Test-Path $hooked)) { throw "hooked capture exe missing: $hooked" }
          $rej = Start-Process $hooked -ArgumentList '--firewall-shape-ok' -Wait -PassThru
          if ($rej.ExitCode -ne 1) { throw "Player unelevated check did not REJECT the 1.1.0 shape (exit $($rej.ExitCode))" }
          # Exact 1.1.0-era files (schema from the 1.1.0 source): legacy settings
          # keys and the old paired.json string-array shape with a phone token.
          $config = Join-Path $env:APPDATA 'ZephyrPlayer'
          New-Item -ItemType Directory -Force $config | Out-Null
          $settingsPath = Join-Path $config 'settings.json'
          $pairingPath = Join-Path $config 'paired.json'
          [IO.File]::WriteAllText($settingsPath, '{"SkipBackSeconds":15,"SkipForwardSeconds":60,"LastVolume":47}')
          [IO.File]::WriteAllText($pairingPath, '["upgrade-smoke-token"]')
          # Upgrade: THIS build's installer over the 1.1.0 install.
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $newInstaller = "windows/Output/Zephyr-PC-$v.exe"
          if (-not (Test-Path $newInstaller)) { throw "new-build installer missing: $newInstaller" }
          $upLog = "$env:RUNNER_TEMP/installer-upgrade-smoke.log"
          $up = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$upLog" -PassThru
          if (-not $up.WaitForExit(150000)) { Get-Content $upLog -Tail 60 -ErrorAction SilentlyContinue; throw 'upgrade installer timed out' }
          if ($up.ExitCode -ne 0) { Get-Content $upLog -Tail 60 -ErrorAction SilentlyContinue; throw "upgrade installer exit $($up.ExitCode)" }
          # Round-7 B7-1: the upgraded app's first launch re-asks the one-time permission
          # because the 1.1.0 rules are the OLD shape (a name-only check would keep them
          # forever). The installer already relaunched the app onto that explained-
          # elevation dialog; the dialog cannot be clicked headless, so the elevated half
          # it leads to is run directly (the runner is admin - exactly what clicking
          # Continue reaches).
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $sidUp = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $fwUp = Start-Process $installed -ArgumentList "--install-firewall `"$sidUp`"" -Wait -PassThru
          if ($fwUp.ExitCode -ne 0) { throw "post-upgrade firewall migration exit $($fwUp.ExitCode)" }
          $acc = Start-Process $hooked -ArgumentList '--firewall-shape-ok' -Wait -PassThru
          if ($acc.ExitCode -ne 0) { throw "Player unelevated check did not ACCEPT the migrated shape (exit $($acc.ExitCode))" }
          # The migration must leave the CURRENT shape, not 1.1.0's: TCP System + 47823 +
          # LocalSubnet, UDP exe + 8490 + LocalSubnet, and no Everyone listen grant.
          $tcpUp = netsh advfirewall firewall show rule name="Zephyr Player" verbose | Out-String
          if ($tcpUp -notmatch 'LocalPort:\s*47823' -or $tcpUp -notmatch 'Program:\s*System' -or $tcpUp -notmatch 'Local subnet|LocalSubnet|localsubnet') { Write-Output $tcpUp; throw 'upgrade migration: TCP rule is not the current shape' }
          $udpUp = netsh advfirewall firewall show rule name="Zephyr Player Discovery" verbose | Out-String
          if ($udpUp -notmatch 'LocalPort:\s*8490' -or $udpUp -notmatch [regex]::Escape($installed) -or $udpUp -notmatch 'Local subnet|LocalSubnet|localsubnet') { Write-Output $udpUp; throw 'upgrade migration: UDP rule is not the current shape (8490, exe, LocalSubnet)' }
          $aclBlock = ((netsh http show urlacl | Out-String) -split "\r?\n\r?\n" | Where-Object { $_ -match ':47823/' } | Select-Object -First 1)
          if (-not $aclBlock) { throw 'upgrade migration: no listen permission for 47823' }
          if ($aclBlock -match 'WD\)') { Write-Output $aclBlock; throw 'upgrade migration: the 1.1.0 Everyone grant survived' }
          # The leftover 1.1.0 HKLM uninstall entry must be gone (it pointed at this
          # install and claimed the 1.1.x version - the only shape the app removes).
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1') {
            if (Test-Path $k) { throw "leftover 1.1.0 HKLM uninstall entry survived the migration: $k" }
          }
          Start-Process $installed
          Start-Sleep -Seconds 8
          $running = Get-Process ZephyrPlayer -ErrorAction SilentlyContinue
          if (-not $running -or @($running | Where-Object { $_.Path -eq $installed }).Count -eq 0) { throw 'upgraded app did not relaunch from the installed path' }
          # The relaunched app's OWN live shape check must have passed: it stamps the
          # per-machine v2 marker (Local, never Roaming) only when the real rules + ACL
          # verify. "App is running" alone passes even with the elevation dialog up.
          $marker = Join-Path $env:LOCALAPPDATA 'ZephyrPlayer\firewall.ok'
          for ($i = 0; $i -lt 10 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker)) { throw 'v2 firewall marker missing after the upgraded relaunch - the app live check did not pass' }
          if ((Get-Content $marker -First 1) -ne 'v2') { throw "firewall marker is not v2: $(Get-Content $marker -First 1)" }
          # Settings values must survive (1.2.0 may extend the file; values must not move).
          $s = Get-Content $settingsPath -Raw | ConvertFrom-Json
          if ($s.LastVolume -ne 47) { throw "upgrade lost LastVolume (got $($s.LastVolume))" }
          $skipOk = ($s.SkipForwardSeconds -eq 60) -or ($s.SecondarySkipSeconds -eq 60)
          if (-not $skipOk) { throw "upgrade lost the 60s skip setting" }
          # The 1.1.0-format pairing token must still authorize a REAL control call.
          $ok200 = $false
          for ($i = 0; $i -lt 15 -and -not $ok200; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer upgrade-smoke-token' } -TimeoutSec 3 -UseBasicParsing
              $ok200 = ($r.StatusCode -eq 200)
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok200) { throw '1.1.0-format pairing token no longer authorizes /control/status after upgrade' }
          $unauth = $false
          try { Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -TimeoutSec 3 -UseBasicParsing | Out-Null } catch { $unauth = ($_.Exception.Response.StatusCode.value__ -eq 401) }
          if (-not $unauth) { throw 'unauthenticated /control/status was not 401 after upgrade' }
          Write-Output 'PUBLISHED_UPGRADE_CONTINUITY: PASS - player-v1.1.0 installed from the release feed, ran, upgraded in place; settings values preserved; 1.1.0-format pairing token still authorizes /control/status (200 with, 401 without).'
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Round-8 N-10: 1.2.0 installs into the same folder + AppId as 1.1.0, so the
          # uninstall log may still hold 1.1.0's recorded [UninstallRun] steps - one was
          # a BLIND "netsh http delete urlacl" with no ownership check. Plant a FOREIGN
          # reservation on 47823, run the post-upgrade uninstaller, and require the
          # reservation to survive; the log is printed either way for inspection.
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh http add urlacl url=http://+:47823/ sddl="D:(A;;GX;;;SY)" | Out-Null
          $aclBefore = (netsh http show urlacl url=http://+:47823/) | Out-String
          $unins = Join-Path (Split-Path $installed) 'unins000.exe'
          if (-not (Test-Path $unins)) { throw "uninstaller missing: $unins" }
          $unLog = "$env:RUNNER_TEMP/uninstall-upgrade-smoke.log"
          # Round-9 T3: never-deleted proof, not just end state. Poll the reservation
          # through the WHOLE uninstall; a single gap means it was deleted (and any
          # later restore would not count as preservation).
          $pollFile = "$env:RUNNER_TEMP/n10-acl-poll.log"
          Remove-Item $pollFile -Force -ErrorAction SilentlyContinue
          $poll = Start-Job -ScriptBlock {
            param($f)
            while ($true) {
              $o = (netsh http show urlacl url=http://+:47823/) 2>&1 | Out-String
              Add-Content $f ($(if ($o -match 'SDDL:') { 'PRESENT' } else { 'MISSING' }))
              Start-Sleep -Milliseconds 400
            }
          } -ArgumentList $pollFile
          $uu = Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$unLog" -PassThru
          if (-not $uu.WaitForExit(150000)) { Stop-Job $poll; Get-Content $unLog -Tail 80 -ErrorAction SilentlyContinue; throw 'post-upgrade uninstaller timed out' }
          Start-Sleep -Seconds 3
          Stop-Job $poll; Remove-Job $poll
          if (Select-String -Path $pollFile -Pattern 'MISSING' -Quiet) {
            Write-Output '--- poll gaps ---'; Get-Content $pollFile
            throw 'N-10: the foreign 47823 reservation was momentarily DELETED during the uninstall (poll gap) - suppression failed'
          }
          $pollCount = (Get-Content $pollFile | Measure-Object -Line).Lines
          if ($pollCount -lt 3) { throw "N-10 poll captured only $pollCount samples - the never-deleted proof is too thin" }
          $aclAfter = (netsh http show urlacl url=http://+:47823/) | Out-String
          if ($aclAfter -notmatch [regex]::Escape('http://+:47823/')) {
            Write-Output '--- uninstall log tail ---'
            Get-Content $unLog -Tail 80 -ErrorAction SilentlyContinue
            throw 'N-10: the foreign 47823 reservation was DELETED by the post-upgrade uninstall - 1.1.0-era blind [UninstallRun] steps fired'
          }
          # Full preservation, not just presence: URL, SDDL and Listen/Delegate flags
          # must be byte-identical (whitespace-normalized) to the planted reservation.
          $norm = { param($t) ($t -replace '\s+', ' ').Trim() }
          if ((& $norm $aclAfter) -ne (& $norm $aclBefore)) {
            Write-Output "--- before ---`n$aclBefore`n--- after ---`n$aclAfter"
            throw 'N-10: the foreign 47823 reservation survived but was CHANGED by the post-upgrade uninstall (SDDL or flags differ)'
          }
          # Suppression proof, not just end state: the uninstall log must not show the
          # legacy blind delete command executing at all (RunOnceId latest-only rule).
          $unLogText = Get-Content $unLog -Raw -ErrorAction SilentlyContinue
          if ($unLogText -match 'http delete urlacl') {
            Write-Output '--- uninstall log tail ---'
            Get-Content $unLog -Tail 80
            throw 'N-10: the uninstall log shows the legacy blind urlacl delete EXECUTED - RunOnceId suppression failed'
          }
          # Round-9 T2: suppression must be EXERCISED, not merely absent: the log must
          # record each legacy id being skipped in favor of our newer same-id entry.
          foreach ($rid in 'delacl','delrule','deldiscrule') {
            if ($unLogText -notmatch "Skipping RunOnceId\s*\"?$rid") {
              Write-Output '--- uninstall log tail ---'
              Get-Content $unLog -Tail 80
              throw "N-10: uninstall log shows no 'Skipping RunOnceId $rid' - the shadow entries were never recorded or never matched"
            }
          }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          Write-Output 'N-10 UNINSTALL: a foreign 47823 reservation survived the post-upgrade uninstall byte-identical (URL + SDDL + flags), and the log shows the legacy blind delete never ran.' 
      - name: Legacy chain + fresh-install uninstall smokes (real artifacts)
        if: always()
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Round-9 T5: the full published chain 1.0.0 -> 1.1.0 -> THIS build, then
          # uninstall: no blind legacy step may fire at any depth of the appended log.
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $priorUnins = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          if (Test-Path $priorUnins) {
            $pu = Start-Process $priorUnins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            $pu.WaitForExit(150000) | Out-Null
          }
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          gh release download player-v1.0.0 -p Zephyr-PC-1.0.0.exe --dir "$env:RUNNER_TEMP/old100" --clobber
          gh release download player-v1.1.0 -p Zephyr-PC-1.1.0.exe --dir "$env:RUNNER_TEMP/old110b" --clobber
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $newInstaller = "windows/Output/Zephyr-PC-$v.exe"
          foreach ($inst in @("$env:RUNNER_TEMP/old100/Zephyr-PC-1.0.0.exe", "$env:RUNNER_TEMP/old110b/Zephyr-PC-1.1.0.exe", $newInstaller)) {
            if (-not (Test-Path $inst)) { throw "chain installer missing: $inst" }
            $ip = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
            if (-not $ip.WaitForExit(150000)) { throw "chain installer timed out: $inst" }
            if ($ip.ExitCode -ne 0) { throw "chain installer exit $($ip.ExitCode): $inst" }
          }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh http add urlacl url=http://+:47823/ sddl="D:(A;;GX;;;SY)" | Out-Null
          $aclBefore = (netsh http show urlacl url=http://+:47823/) | Out-String
          $unins = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          if (-not (Test-Path $unins)) { throw 'chain uninstaller missing' }
          $unLog = "$env:RUNNER_TEMP/uninstall-chain-smoke.log"
          $uu = Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$unLog" -PassThru
          if (-not $uu.WaitForExit(150000)) { Get-Content $unLog -Tail 60 -ErrorAction SilentlyContinue; throw 'chain uninstaller timed out' }
          Start-Sleep -Seconds 3
          $aclAfter = (netsh http show urlacl url=http://+:47823/) | Out-String
          $norm = { param($t) ($t -replace '\s+', ' ').Trim() }
          if ((& $norm $aclAfter) -ne (& $norm $aclBefore)) { Write-Output "--- before ---`n$aclBefore`n--- after ---`n$aclAfter"; throw 'T5: the foreign reservation did not survive the 1.0.0->1.1.0->new chain uninstall byte-identical' }
          $chainLogText = Get-Content $unLog -Raw -ErrorAction SilentlyContinue
          if ($chainLogText -match 'http delete urlacl') { Get-Content $unLog -Tail 80; throw 'T5: a blind legacy delete EXECUTED after the chain' }
          Write-Output 'T5 CHAIN: 1.0.0 -> 1.1.0 -> new build; the foreign reservation survived the uninstall byte-identical and no blind step ran.'
          # Round-9 T6a: FRESH new-build install, then uninstall - OUR per-user grant
          # must be removed by the ownership-checked cleanup.
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          $ip = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $ip.WaitForExit(150000)) { throw 'T6 fresh installer timed out' }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $sid6 = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $exe6 = "$env:LOCALAPPDATA\Programs\Zephyr Player\ZephyrPlayer.exe"
          $fw6 = Start-Process $exe6 -ArgumentList "--install-firewall `"$sid6`"" -Wait -PassThru
          if ($fw6.ExitCode -ne 0) { throw "T6 setup exit $($fw6.ExitCode)" }
          $uu = Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $uu.WaitForExit(150000)) { throw 'T6 uninstaller timed out' }
          Start-Sleep -Seconds 3
          $left = (netsh http show urlacl url=http://+:47823/) 2>&1 | Out-String
          if ($left -match 'SDDL:') { throw 'T6: our own 47823 reservation was LEFT behind by the fresh-install uninstall' }
          Write-Output 'T6 FRESH: our own reservation was removed by the uninstall.'
          # Round-9 T6b: fresh install with a FOREIGN reservation planted over ours:
          # the uninstall must leave the reservation AND the rules untouched.
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          $ip = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $ip.WaitForExit(150000)) { throw 'T6b fresh installer timed out' }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh http add urlacl url=http://+:47823/ sddl="D:(A;;GX;;;SY)" | Out-Null
          $uu = Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $uu.WaitForExit(150000)) { throw 'T6b uninstaller timed out' }
          Start-Sleep -Seconds 3
          $aclB = (netsh http show urlacl url=http://+:47823/) | Out-String
          if ($aclB -notmatch 'SY\)') { Write-Output $aclB; throw 'T6b: the foreign reservation did not survive the fresh-install uninstall' }
          $rulesB = netsh advfirewall firewall show rule name="Zephyr Player" | Out-String
          if ($rulesB -notmatch 'Zephyr Player') { throw 'T6b: the firewall rules were deleted while the reservation was foreign' }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh advfirewall firewall delete rule name="Zephyr Player" | Out-Null
          netsh advfirewall firewall delete rule name="Zephyr Player Discovery" | Out-Null
          Write-Output 'T6 FOREIGN: the foreign reservation and the rules survived the fresh-install uninstall.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-evidence
          path: |
            ${{ runner.temp }}/pc-pairing-render.png
            ${{ runner.temp }}/pc-home-render.png
            ${{ runner.temp }}/pc-desktop-pairing.png
            ${{ runner.temp }}/pc-tray-menu.png
            ${{ runner.temp }}/pc-tray-icon.png
            ${{ runner.temp }}/pc-tray-diag.txt
            ${{ runner.temp }}/pc-controlbar-render.png
            ${{ runner.temp }}/pc-desktop.png
            ${{ runner.temp }}/pc-home-library.png
            ${{ runner.temp }}/pc-desktop-settings.png
            ${{ runner.temp }}/pc-desktop-settings-updates.png
            ${{ runner.temp }}/pc-playing-controls-window.png
            ${{ runner.temp }}/pc-playing-controls-fullscreen.png
            ${{ runner.temp }}/pc-smoke-*.png
            ${{ runner.temp }}/pc-bar-*.png
            ${{ runner.temp }}/pc-desktop-note.txt
            ${{ runner.temp }}/installer-smoke.log
            ${{ runner.temp }}/installer-update-smoke.log
            ${{ runner.temp }}/installer-old110.log
            ${{ runner.temp }}/installer-upgrade-smoke.log
            ${{ runner.temp }}/uninstall-upgrade-smoke.log
            ${{ runner.temp }}/n10-acl-poll.log
          if-no-files-found: warn
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zephyr-PC-installer
          path: windows/Output/Zephyr-PC-*.exe
          if-no-files-found: warn
      - name: "Gate summary (honest split - tests vs evidence)"
        if: always()
        shell: pwsh
        run: |
          Write-Host "PLAYER TESTS OUTCOME: ${{ steps.tests.outcome }}"
          Write-Host "HELPER TESTS OUTCOME: ${{ steps.zvrtests.outcome }}"
          Write-Host "Evidence steps run unconditionally; a green job requires tests green too."
