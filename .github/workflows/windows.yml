          Start-Sleep -Seconds 2
          $settingsBefore = Get-Content $settingsPath -Raw
          $pairBefore = (Get-FileHash $pairingPath -Algorithm SHA256).Hash
          Note140 "settings before upgrade: $settingsBefore"
          # Upgrade in place with THIS build's installer.
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $newInstaller = "windows/Output/Zephyr-PC-$v.exe"
          if (-not (Test-Path $newInstaller)) { throw "candidate installer missing: $newInstaller" }
          $upLog = "$env:RUNNER_TEMP/installer-140-upgrade.log"
          $up = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$upLog" -PassThru
          if (-not $up.WaitForExit(150000)) { Get-Content $upLog -Tail 60 -ErrorAction SilentlyContinue; throw 'candidate upgrade installer timed out' }
          if ($up.ExitCode -ne 0) { Get-Content $upLog -Tail 60 -ErrorAction SilentlyContinue; throw "candidate upgrade installer exit $($up.ExitCode)" }
          $pvNew = (Get-Item $installed).VersionInfo.ProductVersion
          $hashNew = (Get-FileHash $installed -Algorithm SHA256).Hash
          $short = "${{ github.sha }}".Substring(0, 7)
          Note140 "after upgrade: ProductVersion=$pvNew exe sha256=$hashNew (candidate commit $short)"
          if ($hashNew -eq $hashOld) { throw 'the installed exe is still the published 1.4.0 binary - the upgrade did not replace it' }
          if ($pvNew -notlike "*$short*") { throw "upgraded exe ProductVersion $pvNew does not name the candidate commit $short" }
          $running = $false
          for ($i = 0; $i -lt 20 -and -not $running; $i++) { Start-Sleep -Seconds 1; $running = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed }) }
          if (-not $running) { Start-Process $installed; Start-Sleep -Seconds 6; $running = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed }) }
          if (-not $running) { throw 'upgraded candidate never ran from the installed path' }
          # Pairing continuity: the 1.4.0-era token authorizes a real control call.
          $okNew = $false
          for ($i = 0; $i -lt 20 -and -not $okNew; $i++) {
            try { $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer upgrade-140-token' } -TimeoutSec 3 -UseBasicParsing; $okNew = ($r.StatusCode -eq 200) } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $okNew) { throw '1.4.0 pairing token no longer authorizes /control/status after the upgrade' }
          $unauth = $false
          try { Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -TimeoutSec 3 -UseBasicParsing | Out-Null } catch { $unauth = ($_.Exception.Response.StatusCode.value__ -eq 401) }
          if (-not $unauth) { throw 'unauthenticated /control/status was not 401 after the upgrade' }
          $wrong = $false
          try { Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer not-the-token' } -TimeoutSec 3 -UseBasicParsing | Out-Null } catch { $wrong = ($_.Exception.Response.StatusCode.value__ -eq 401) }
          if (-not $wrong) { throw 'a wrong token was not 401 after the upgrade' }
          # Settings continuity: every 1.4.0 value unchanged (2.0 may add keys).
          $s = Get-Content $settingsPath -Raw | ConvertFrom-Json
          $lost = @()
          foreach ($k in $want.Keys) {
            $a = $want[$k]; $b = $s.$k
            if ("$a" -ne "$b") { $lost += "$k ($a -> $b)" }
          }
          Note140 "settings after upgrade: $(Get-Content $settingsPath -Raw)"
          if ($lost.Count -gt 0) { throw "upgrade changed 1.4.0 settings: $($lost -join ', ')" }
          $pairAfter = (Get-FileHash $pairingPath -Algorithm SHA256).Hash
          Note140 "paired.json sha256 before=$pairBefore after=$pairAfter ($(if ($pairBefore -eq $pairAfter) { 'unchanged' } else { 'rewritten by the candidate' }))"
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Note140 "PUBLISHED_140_UPGRADE_CONTINUITY: PASS - published player-v1.4.0 installed, ran, authorized its paired token (200); THIS build's installer replaced the exe in place ($pvOld -> $pvNew); all $($want.Count) settings values unchanged; the 1.4.0 token still authorizes /control/status (200), no token and a wrong token get 401."

      - name: Legacy chain + fresh-install uninstall smokes (real artifacts)
        if: always()
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Round-9 T5: the full published chain 1.0.0 -> 1.1.0 -> THIS build, then
          # uninstall: no blind legacy step may fire at any depth of the appended log.
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $priorUnins = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          if (Test-Path $priorUnins) {
            $pu = Start-Process $priorUnins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            $pu.WaitForExit(150000) | Out-Null
          }
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          gh run download 40387624659 -n Zephyr-PC-installer --dir "$env:RUNNER_TEMP/old100"
          gh run download 40413487207 -n Zephyr-PC-installer --dir "$env:RUNNER_TEMP/old110b"
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $newInstaller = "windows/Output/Zephyr-PC-$v.exe"
          $link = 0
          foreach ($inst in @("$env:RUNNER_TEMP/old100/Zephyr-PC-1.0.0.exe", "$env:RUNNER_TEMP/old110b/Zephyr-PC-1.1.0.exe", $newInstaller)) {
            if (-not (Test-Path $inst)) { throw "chain installer missing: $inst" }
            # Each silent install auto-launches the player ([Run] skipifnotsilent is
            # satisfied by silent); a running exe locks files for the next link and the
            # suppressed file-in-use box aborts it (round-10 chain exit 5).
            Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            $link++
            $linkLog = "$env:RUNNER_TEMP/chain-install-$link.log"
            $ip = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$linkLog" -PassThru
            if (-not $ip.WaitForExit(150000)) { Get-Content $linkLog -Tail 60 -ErrorAction SilentlyContinue; throw "chain installer timed out: $inst" }
            if ($ip.ExitCode -ne 0) { Get-Content $linkLog -Tail 60 -ErrorAction SilentlyContinue; throw "chain installer exit $($ip.ExitCode): $inst" }
          }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh http add urlacl url=http://+:47823/ sddl="D:(A;;GX;;;SY)" | Out-Null
          $aclBefore = (netsh http show urlacl url=http://+:47823/) | Out-String
          $unins = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          if (-not (Test-Path $unins)) { throw 'chain uninstaller missing' }
          $unLog = "$env:RUNNER_TEMP/uninstall-chain-smoke.log"
          $uu = Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$unLog" -PassThru
          if (-not $uu.WaitForExit(150000)) { Get-Content $unLog -Tail 60 -ErrorAction SilentlyContinue; throw 'chain uninstaller timed out' }
          Start-Sleep -Seconds 3
          $aclAfter = (netsh http show urlacl url=http://+:47823/) | Out-String
          $norm = { param($t) ($t -replace '\s+', ' ').Trim() }
          if ((& $norm $aclAfter) -ne (& $norm $aclBefore)) { Write-Output "--- before ---`n$aclBefore`n--- after ---`n$aclAfter"; throw 'T5: the foreign reservation did not survive the 1.0.0->1.1.0->new chain uninstall byte-identical' }
          $chainLogText = Get-Content $unLog -Raw -ErrorAction SilentlyContinue
          if ($chainLogText -match 'http delete urlacl') { Get-Content $unLog -Tail 80; throw 'T5: a blind legacy delete EXECUTED after the chain' }
          Write-Output 'T5 CHAIN: 1.0.0 -> 1.1.0 -> new build; the foreign reservation survived the uninstall byte-identical and no blind step ran.'
          # Round-9 T6a: FRESH new-build install, then uninstall - OUR per-user grant
          # must be removed by the ownership-checked cleanup.
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          $ip = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $ip.WaitForExit(150000)) { throw 'T6 fresh installer timed out' }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $sid6 = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $exe6 = "$env:LOCALAPPDATA\Programs\Zephyr Player\ZephyrPlayer.exe"
          $fw6 = Start-Process $exe6 -ArgumentList "--install-firewall `"$sid6`"" -Wait -PassThru
          if ($fw6.ExitCode -ne 0) { throw "T6 setup exit $($fw6.ExitCode)" }
          $uu = Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP\uninstall-t6a.log" -PassThru
          if (-not $uu.WaitForExit(150000)) { throw 'T6 uninstaller timed out' }
          Start-Sleep -Seconds 3
          $left = (netsh http show urlacl url=http://+:47823/) 2>&1 | Out-String
          if ($left -match 'SDDL:') { throw 'T6: our own 47823 reservation was LEFT behind by the fresh-install uninstall' }
          Write-Output 'T6 FRESH: our own reservation was removed by the uninstall.'
          # Round-9 T6b: fresh install with a FOREIGN reservation planted over ours:
          # the uninstall must leave the reservation AND the rules untouched.
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          $ip = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $ip.WaitForExit(150000)) { throw 'T6b fresh installer timed out' }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # The leg must ESTABLISH our rules before it can prove they survive: a fresh
          # silent install only shows the permission dialog (never clicked headless),
          # so without this setup pass there are no rules to keep (gate 40508776538:
          # the rules check fired on absence, not deletion).
          $sidB = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $exeB = "$env:LOCALAPPDATA\Programs\Zephyr Player\ZephyrPlayer.exe"
          $fwB = Start-Process $exeB -ArgumentList "--install-firewall `"$sidB`"" -Wait -PassThru
          if ($fwB.ExitCode -ne 0) { throw "T6b setup exit $($fwB.ExitCode)" }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh http add urlacl url=http://+:47823/ sddl="D:(A;;GX;;;SY)" | Out-Null
          $aclPlanted = (netsh http show urlacl url=http://+:47823/) | Out-String
          $uu = Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP\uninstall-t6b.log" -PassThru
          if (-not $uu.WaitForExit(150000)) { throw 'T6b uninstaller timed out' }
          Start-Sleep -Seconds 3
          $aclB = (netsh http show urlacl url=http://+:47823/) | Out-String
          $normB = { param($t) ($t -replace '\s+', ' ').Trim() }
          if ((& $normB $aclB) -ne (& $normB $aclPlanted)) { Write-Output "--- planted ---`n$aclPlanted`n--- after ---`n$aclB"; throw 'T6b: the foreign reservation did not survive the fresh-install uninstall byte-identical' }
          $rulesB = netsh advfirewall firewall show rule name="Zephyr Player" | Out-String
          if ($rulesB -notmatch 'Zephyr Player') { Write-Output $rulesB; Get-Content "$env:RUNNER_TEMP/uninstall-chain-smoke.log" -Tail 60 -ErrorAction SilentlyContinue; throw 'T6b: the firewall rules were deleted while the reservation was foreign' }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh advfirewall firewall delete rule name="Zephyr Player" | Out-Null
          netsh advfirewall firewall delete rule name="Zephyr Player Discovery" | Out-Null
          Write-Output 'T6 FOREIGN: the foreign reservation and the rules survived the fresh-install uninstall.'

      - name: Legacy HKLM uninstall entry behavior proof (upgrade, setup declined)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Round-10 N10-4: what does the leftover 1.1.0 HKLM uninstall entry ACTUALLY
          # run after an upgrade where setup never completed (UAC declined/failed) -
          # which exe, which log, and does a foreign reservation survive going through
          # THAT entry. Empirical; nothing inferred from shared-folder assumptions.
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $priorUnins = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          if (Test-Path $priorUnins) {
            $pu = Start-Process $priorUnins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            $pu.WaitForExit(150000) | Out-Null
          }
          Remove-Item "$env:LOCALAPPDATA\Programs\Zephyr Player" -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1') {
            Remove-Item $k -Recurse -Force -ErrorAction SilentlyContinue
          }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          gh run download 40413487207 -n Zephyr-PC-installer --dir "$env:RUNNER_TEMP/leg110"
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $newInstaller = "windows/Output/Zephyr-PC-$v.exe"
          $i1 = Start-Process "$env:RUNNER_TEMP/leg110/Zephyr-PC-1.1.0.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $i1.WaitForExit(150000)) { throw 'legacy leg: 1.1.0 install timed out' }
          if ($i1.ExitCode -ne 0) { throw "legacy leg: 1.1.0 install exit $($i1.ExitCode)" }
          $uninsPath = "$env:LOCALAPPDATA\Programs\Zephyr Player\unins000.exe"
          $stamp110 = (Get-Item $uninsPath).LastWriteTimeUtc
          $beforeEngineHash = (Get-FileHash $uninsPath -Algorithm SHA256).Hash
          Write-Output "UNINSTALL_ENGINE_BEFORE_SHA256=$beforeEngineHash"
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          # Upgrade; do NOT run setup - the UAC-declined/failed leg.
          $i2 = Start-Process $newInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS' -PassThru
          if (-not $i2.WaitForExit(150000)) { throw 'legacy leg: upgrade install timed out' }
          if ($i2.ExitCode -ne 0) { throw "legacy leg: upgrade install exit $($i2.ExitCode)" }
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          # The HKLM entry must STILL exist: no elevated setup ran to clear it.
          $entry = $null
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Zephyr Player_is1') {
            if (Test-Path $k) { $entry = Get-ItemProperty $k; break }
          }
          if (-not $entry) { throw 'legacy leg: expected the 1.1.0 HKLM uninstall entry to STILL EXIST after a setup-declined upgrade' }
          $us = [string]$entry.UninstallString
          Write-Output "legacy HKLM UninstallString: $us"
          # Identity: the entry must target the shared unins000.exe. Engine bytes
          # may be unchanged; actual behavior below is the safety verdict.
          $target = $us.Trim() -replace '^"', '' -replace '".*$', '' -replace '\s+/.*$', ''
          if (-not (Test-Path $target)) { throw "legacy leg: entry target missing: $target" }
          $stampNew = (Get-Item $target).LastWriteTimeUtc
          Write-Output "unins000.exe stamps: after-1.1.0=$stamp110 entry-target=$stampNew"
          # Timestamp/hash are diagnostic. Actual legacy-entry behavior below is
          # the safety verdict; do not infer replacement from modification time.
          Write-Output "uninstaller engine metadata: $((Get-Item $target).VersionInfo.FileVersion)"
          $afterEngineHash = (Get-FileHash $target -Algorithm SHA256).Hash
          Write-Output "UNINSTALL_ENGINE_AFTER_SHA256=$afterEngineHash CHANGED=$($afterEngineHash -ne $beforeEngineHash)"
          if ((Resolve-Path $target).Path -ne (Resolve-Path $uninsPath).Path) { throw "legacy leg: entry target is not the shared uninstaller: $target" }
          # Behavior through THAT entry: plant a foreign reservation, invoke the path.
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          netsh http add urlacl url=http://+:47823/ sddl="D:(A;;GX;;;SY)" | Out-Null
          $aclBefore = (netsh http show urlacl url=http://+:47823/) | Out-String
          $legLog = "$env:RUNNER_TEMP/uninstall-legacy-entry.log"
          $uu = Start-Process $target -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$legLog" -PassThru
          if (-not $uu.WaitForExit(150000)) { Get-Content $legLog -Tail 60 -ErrorAction SilentlyContinue; throw 'legacy leg: entry uninstaller timed out' }
          Start-Sleep -Seconds 3
          $aclAfter = (netsh http show urlacl url=http://+:47823/) | Out-String
          $norm = { param($t) ($t -replace '\s+', ' ').Trim() }
          if ((& $norm $aclAfter) -ne (& $norm $aclBefore)) {
            Write-Output "--- before ---`n$aclBefore`n--- after ---`n$aclAfter"
            Get-Content $legLog -Tail 80 -ErrorAction SilentlyContinue
            throw 'legacy leg: the foreign reservation did not survive the HKLM-entry uninstall byte-identical - the leftover entry IS a blind-delete path'
          }
          $legText = Get-Content $legLog -Raw -ErrorAction SilentlyContinue
          if ($legText -match 'http delete urlacl') { Get-Content $legLog -Tail 80; throw 'legacy leg: the blind delete EXECUTED through the HKLM entry' }
          foreach ($rid in 'delacl','delrule','deldiscrule') {
            if ($legText -notmatch ('Skipping RunOnceId\s*"?' + $rid)) { Get-Content $legLog -Tail 80; throw "legacy leg: no 'Skipping RunOnceId $rid' through the HKLM entry - suppression did not engage on this path" }
          }
          netsh http delete urlacl url=http://+:47823/ | Out-Null
          Write-Output 'LEGACY HKLM ENTRY: targets the shared post-upgrade unins000.exe; the foreign reservation survived byte-identical and every blind legacy id was skipped through this path too.'

