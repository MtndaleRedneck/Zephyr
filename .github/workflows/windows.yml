name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'scripts/pc_desktop_capture.ps1'
      - 'scripts/vlc_remote_e2e.ps1'
      - 'scripts/vlc_http_proof.ps1'
      - 'scripts/range_server.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# Windows player: build, tests, real-VLC proof, installer, desktop captures.
# Runs only when Windows-side files change.
# Evidence steps (proof/publish/installer/captures) run even when tests fail,
# so UI pixels and the installer are never held hostage by a test regression.
# The overall job still fails when tests fail: evidence is not the gate.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  vlc-remote-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Publish helper exe (with the CI-only pairing hook)
        run: dotnet publish windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/ZephyrVlcRemote/out

      # The movies test launches real VLC; install it as its own step so a mirror hiccup is visible.
      - name: Install VLC (for the movies launch test)
        run: choco install vlc --no-progress -y
      - name: Install ffmpeg (makes the long clip for the end-to-end resume case)
        run: choco install ffmpeg --no-progress -y

      - name: Publish the clean release exe (no CI hooks - the build that ships)
        run: dotnet publish windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o windows/ZephyrVlcRemote/release-out

      # The installer is built ONLY from the clean release build - the hooked test exe
      # (out/) never reaches an artifact. The e2e proves the installed build ignores
      # ZEPHYR_VLC_REMOTE_PAIR_CODE before any runtime test runs.
      - name: Build the installer from the clean release build
        run: |
          ./scripts/pinned_installer_toolchain.ps1
          if((Get-FileHash 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' -Algorithm SHA256).Hash-ne(Get-Content "$env:RUNNER_TEMP/zephyr-iscc-sha256.txt").Trim()){throw 'ISCC binary drifted'}
          if((Get-FileHash 'C:/Program Files (x86)/Inno Setup 6/ISCmplr.dll' -Algorithm SHA256).Hash-ne(Get-Content "$env:RUNNER_TEMP/zephyr-compiler-engine-sha256.txt").Trim()){throw 'Compiler engine drifted'}
          $v = Select-String -Path windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "/DMySourceDir=release-out" windows/ZephyrVlcRemote/installer.iss 2>&1 | Tee-Object "$env:RUNNER_TEMP/helper-iscc.log"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if ((Get-Content "$env:RUNNER_TEMP/helper-iscc.log" -Raw) -notmatch 'Compiler engine version: Inno Setup 6\.6\.1(?:\D|$)') { throw "Actual successful compile banner is not 6.6.1" }

      - name: Upload helper installer artifact
        # The E2E legs install and pair-test this exact installer; keep it as a
        # run artifact so the tested build can be delivered without a rebuild.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zephyr-VLC-Remote-installer
          path: windows/ZephyrVlcRemote/Output/ZephyrVLCRemote-PC-*.exe
          if-no-files-found: error


      - name: Render the helper window for layout review (CI only)
        run: |
          dotnet publish windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/ZephyrVlcRemote/shot
          $shots = @(
            @('window', 'window.png'),
            @('pairing-expired', 'window-pairing-expired.png'),
            @('pairing', 'window-pairing.png'),
            @('broken-store', 'window-broken-store.png'),
            @('remove', 'dialog-remove.png'),
            @('remove-all', 'dialog-remove-all.png'),
            @('tray', 'tray-menu.png')
          )
          foreach ($shot in $shots) {
            $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT = "$PWD\windows\ZephyrVlcRemote\$($shot[1])"
            $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = $shot[0]
            # pwsh does NOT wait for a GUI-subsystem exe started with &: the stale
            # $LASTEXITCODE (publish's 0) read as success while the render was still
            # mid-flight (gate 40511800617: window.png landed AFTER the check threw).
            $hp = Start-Process "$PWD\windows\ZephyrVlcRemote\shot\ZephyrVlcRemote.exe" -ArgumentList '--window-shot' -Wait -PassThru
            if ($hp.ExitCode -ne 0) { throw "helper window-shot $($shot[0]) exit $($hp.ExitCode)" }
            $pngOk = $false
            foreach ($try in 1..40) { if (Test-Path "windows/ZephyrVlcRemote/$($shot[1])") { $pngOk = $true; break }; Start-Sleep -Milliseconds 250 }
            if (-not $pngOk) { Get-ChildItem windows/ZephyrVlcRemote -Filter *.png | Select-Object Name,Length; throw "helper window-shot $($shot[0]) wrote no PNG" }
          }
          Remove-Item Env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT, Env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE

      # Round-9 missing-captures: the Player permission dialogs with REAL interaction
      # state - hover/pressed from the real cursor parked over the primary button,
      # focus from real keyboard focus. Behavior proof for the N9-7 template fix.
      - name: Render the Player permission dialogs with real states (CI only)
        run: |
          dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/ZephyrPlayer/shot
          foreach ($m in 'explain','hover','pressed','focus','note') {
            # Same GUI-wait fix as the helper loop above; on failure the hook's own
            # diag file names the exact step/exception.
            $pp = Start-Process "$PWD\windows\ZephyrPlayer\shot\ZephyrPlayer.exe" -ArgumentList '--dialog-shot', $m, "$PWD\windows\ZephyrPlayer\dialog-$m.png" -Wait -PassThru
            if ($pp.ExitCode -ne 0) { Get-Content "windows/ZephyrPlayer/dialog-$m.diag.txt" -ErrorAction SilentlyContinue; throw "dialog-shot $m exit $($pp.ExitCode)" }
            $pngOk = $false
            foreach ($try in 1..40) { if (Test-Path "windows/ZephyrPlayer/dialog-$m.png") { $pngOk = $true; break }; Start-Sleep -Milliseconds 250 }
            if (-not $pngOk) { Get-Content "windows/ZephyrPlayer/dialog-$m.diag.txt" -ErrorAction SilentlyContinue; Get-ChildItem windows/ZephyrPlayer -Filter "dialog-*" | Select-Object Name,Length; throw "dialog-shot $m wrote no PNG" }
          }

      # Round-10 regression proof: the REAL production remove-confirm entry point
      # (ConfirmDialog.Ask) - cancel must cancel, confirm must confirm. Guards the
      # disposed-Build crash class, not just the capture path.
      - name: Production remove-dialog open/cancel/confirm proof (CI only)
        run: |
          $env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE = "remove-paths"
          $rp = Start-Process "$PWD\windows\ZephyrVlcRemote\shot\ZephyrVlcRemote.exe" -ArgumentList '--window-shot' -Wait -PassThru -RedirectStandardError "$env:RUNNER_TEMP\remove-paths.log"
          Get-Content "$env:RUNNER_TEMP\remove-paths.log" -ErrorAction SilentlyContinue
          if ($rp.ExitCode -ne 0) { throw "remove-dialog production paths exit $($rp.ExitCode)" }
          Remove-Item Env:ZEPHYR_VLC_REMOTE_WINDOW_SHOT_MODE

      - name: Upload the window shot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zephyr-VLC-Remote-window
          path: |
            windows/ZephyrVlcRemote/window*.png
            windows/ZephyrVlcRemote/dialog-*.png
            windows/ZephyrVlcRemote/tray-menu.png
            windows/ZephyrVlcRemote/window-diag.txt
            windows/ZephyrPlayer/dialog-*.png
            windows/ZephyrPlayer/dialog-*.diag.txt
          if-no-files-found: warn

      # Round-9 R9-2 / round-10 B10-3: compile-out proof on the PRODUCTION artifact.
      - name: Helper runtime tests (migration, pairing, endpoints, discovery identity, firewall)
        run: pwsh -File scripts/vlc_remote_e2e.ps1

      # Byte-true scan: Latin1 maps bytes 1:1, so a UTF-16LE needle's byte pattern
      # matches at any file offset (a whole-file UTF-16 decode is alignment-blind and
      # misses literals at odd offsets). Runs AFTER the render/upload steps so a
      # failure here can never skip evidence collection.
      - name: Hook compile-out proof (shipped exe has no CI seams)
        # !cancelled(): a runtime-test failure must NOT skip this proof (round-11
        # B10-3 gap - the proof was skipped at a red head, leaving NO head with
        # both runtime pass and compile-out proof).
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $latin = [Text.Encoding]::GetEncoding(28591)
          $clean = $latin.GetString([IO.File]::ReadAllBytes("windows/ZephyrVlcRemote/release-out/ZephyrVlcRemote.exe"))
          $hooked = $latin.GetString([IO.File]::ReadAllBytes("windows/ZephyrVlcRemote/out/ZephyrVlcRemote.exe"))
          foreach ($needle in 'firewall-shape-ok','ZEPHYR_VLC_REMOTE_PAIR_CODE','window-shot') {
            $hookedHas = $false
            foreach ($enc in [Text.Encoding]::Unicode, [Text.Encoding]::ASCII) {
              $n = $latin.GetString($enc.GetBytes($needle))
              # Clean: the needle in ANY encoding fails (the seam must be fully out).
              if ($clean.Contains($n)) { throw "clean release exe contains CI hook string '$needle' ($($enc.EncodingName)) - the seam is not compiled out" }
              # Hooked: presence in EITHER encoding is enough - managed literals are
              # UTF-16, so demanding ASCII too failed a correct build (gate 40514926515).
              if ($hooked.Contains($n)) { $hookedHas = $true }
            }
            if (-not $hookedHas) { throw "hooked exe is missing '$needle' in any encoding - wrong build published to out/" }
          }
          Write-Output 'compile-out proof: shipped exe has no CI hook strings; hooked exe has them.'


  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build Zephyr Player
        timeout-minutes: 8
        run: dotnet build windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release
      - name: Build Zephyr VLC Remote helper
        timeout-minutes: 8
        run: dotnet build windows/ZephyrVlcRemote/ZephyrVlcRemote.csproj -c Release
      - name: Windows test suite (blame-hang bounded; no silent host)
        # Independent suites: a red in one never skips the other - both results are collected.
        if: always()
        id: tests
        timeout-minutes: 10
        run: >
          dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release
          --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type mini
          --logger "trx;LogFileName=win-tests.trx"
          --logger "console;verbosity=detailed"
      - name: Zephyr VLC Remote test suite
        # Independent suites: a red in one never skips the other - both results are collected.
        if: always()
        id: zvrtests
        timeout-minutes: 10
        run: >
          dotnet test windows/ZephyrVlcRemote.Tests/ZephyrVlcRemote.Tests.csproj -c Release
          --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type mini
          --logger "trx;LogFileName=zvr-tests.trx"
      - name: Upload test diagnostics (TRX + hang dumps)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-diagnostics
          path: |
            windows/ZephyrPlayer.Tests/TestResults/
            windows/ZephyrVlcRemote.Tests/TestResults/
            ${{ runner.temp }}/sta-error-*.txt
          if-no-files-found: warn
      - name: Real VLC network playback proof (phone->VLC route)
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: scripts/vlc_http_proof.ps1
      - name: Publish single-file exe
        if: always()
        timeout-minutes: 8
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o windows/out
      - name: Verify bundled native VLC inventory against resolved package
        if: always()
        shell: pwsh
        run: scripts/verify_native_inventory.ps1 -Published windows/out -Version 3.0.24
      - name: Build installer (Inno Setup)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        run: |
          ./scripts/pinned_installer_toolchain.ps1
          if((Get-FileHash 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' -Algorithm SHA256).Hash-ne(Get-Content "$env:RUNNER_TEMP/zephyr-iscc-sha256.txt").Trim()){throw 'ISCC binary drifted'}
          if((Get-FileHash 'C:/Program Files (x86)/Inno Setup 6/ISCmplr.dll' -Algorithm SHA256).Hash-ne(Get-Content "$env:RUNNER_TEMP/zephyr-compiler-engine-sha256.txt").Trim()){throw 'Compiler engine drifted'}
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" windows/installer.iss 2>&1 | Tee-Object "$env:RUNNER_TEMP/player-iscc.log"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if ((Get-Content "$env:RUNNER_TEMP/player-iscc.log" -Raw) -notmatch 'Compiler engine version: Inno Setup 6\.6\.1(?:\D|$)') { throw "Actual successful compile banner is not 6.6.1" }
      - name: Icon proof (exe + installer embed the approved assets/icon.ico)
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: |
          python -m pip install --quiet pefile==2024.8.26
          $setup = (Get-ChildItem windows/Output/Zephyr-PC-*.exe | Select-Object -First 1).FullName
          python scripts/icon_proof.py windows/ZephyrPlayer/assets/icon.ico "$env:RUNNER_TEMP/icon-proof.txt" windows/out/ZephyrPlayer.exe $setup
          if ($LASTEXITCODE -ne 0) { throw 'icon proof failed: a shipped binary does not carry the approved icon frames' }
      - name: Publish hooked capture build (CI-only seam compiled in - never shipped)
        if: always()
        timeout-minutes: 8
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -p:RestoreLockedMode=true -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:CaptureHook=true" -o windows/capture-out
      - name: Player hook compile-out proof (shipped exe has no CI seams)
        # Same byte-true scan as the helper's (round-12): the tray diag env read was
        # the one seam found outside a hook; the scan keeps that class from returning.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $latin = [Text.Encoding]::GetEncoding(28591)
          $clean = $latin.GetString([IO.File]::ReadAllBytes("windows/out/ZephyrPlayer.exe"))
          $hooked = $latin.GetString([IO.File]::ReadAllBytes("windows/capture-out/ZephyrPlayer.exe"))
          foreach ($needle in 'ZEPHYR_TRAY_DIAG', 'dialog-shot', 'ci-capture-token', 'ZEPHYR_CI_CAPTURE', 'ZEPHYR_SWITCH_TRACE') {
            $hookedHas = $false
            foreach ($enc in [Text.Encoding]::Unicode, [Text.Encoding]::ASCII) {
              $n = $latin.GetString($enc.GetBytes($needle))
              if ($clean.Contains($n)) { throw "clean Player exe contains CI hook string '$needle' ($($enc.EncodingName)) - the seam is not compiled out" }
              if ($hooked.Contains($n)) { $hookedHas = $true }
            }
            if (-not $hookedHas) { throw "hooked Player exe is missing '$needle' in any encoding - wrong build published to capture-out/" }
          }
          Write-Output 'Player compile-out proof: shipped exe has no CI hook strings; hooked exe has them.'
      - name: Real-desktop capture (hooked CI build - the shipped exe has no capture token)
        if: always()
        # Passing runs already take ~5:47 of the old 6-minute budget; the
        # poll-close of the first-run Settings window adds seconds per leg.
        timeout-minutes: 10
        shell: pwsh
        run: scripts/pc_desktop_capture.ps1
      - name: Install + update continuity smoke (real installer)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        run: |
          # Actually INSTALL the artifact, not just build it: silent install,
          # auto-launch as the original user, verify the installed exe is
          # alive (its on-open update check runs in this window too), then
          # stop it so nothing holds the single-instance mutex.
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          $installer = "windows/Output/Zephyr-PC-$v.exe"
          if (-not (Test-Path $installer)) { throw "installer missing: $installer" }
          $installLog = "$env:RUNNER_TEMP/installer-smoke.log"
          $ip = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCLOSEAPPLICATIONS',"/LOG=$installLog" -PassThru
          if (-not $ip.WaitForExit(150000)) {
            Get-Content $installLog -Tail 80 -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match 'Zephyr|setup|netsh' } | Format-Table Id,ProcessName,MainWindowTitle
            throw "installer timed out; see installer-smoke.log"
          }
          if ($ip.ExitCode -ne 0) { Get-Content $installLog -Tail 60; throw "installer exit $($ip.ExitCode)" }
          $installed = "$env:LOCALAPPDATA\Programs\Zephyr Player\ZephyrPlayer.exe"
          if (-not (Test-Path $installed)) { throw "installed exe missing: $installed" }
          Write-Output "installed: $installed"
          # The per-user installer no longer adds firewall rules or the listen
          # permission (round-6 N-8): run the app's own setup step headless (the CI
          # runner is elevated, so the same code path the explained first-run
          # elevation takes just runs without the prompt) and verify its shape.
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $fw = Start-Process $installed -ArgumentList '--install-firewall',$sid -PassThru -Wait -WindowStyle Hidden
          if ($fw.ExitCode -ne 0) {
            Write-Host "passed SID: $sid"
            $aclAll = netsh http show urlacl | Out-String
            $block = ($aclAll -split "\r?\n\r?\n" | Where-Object { $_ -match ':47823/' } | Select-Object -First 1)
            Write-Host "47823 reservation after setup:"; Write-Host $block
            throw "--install-firewall exit $($fw.ExitCode)"
          }
          $tcp = netsh advfirewall firewall show rule name="Zephyr Player" verbose | Out-String
          if ($tcp -notmatch 'LocalPort:\s*47823') { throw 'TCP rule missing 47823' }
          if ($tcp -notmatch 'System') { throw 'TCP rule must scope program=System (http.sys attribution)' }
          if ($tcp -notmatch 'Private') { throw 'TCP rule must be Private-only' }
          if ($tcp -notmatch 'Local subnet|Localsubnet|localsubnet') { throw 'TCP rule must be LocalSubnet' }
          $udp = netsh advfirewall firewall show rule name="Zephyr Player Discovery" verbose | Out-String
          if ($udp -notmatch [regex]::Escape($installed.Replace('\','\')) -and $udp -notmatch 'ZephyrPlayer.exe') { throw 'UDP rule must scope the exe' }
          $acl = netsh http show urlacl | Out-String
          if ($acl -notmatch '47823') { throw 'URL ACL for 47823 missing' }
          # netsh stores well-known accounts as SDDL aliases (RID-500 admin -> "LA"):
          # compare parsed security descriptors, not the raw SID string.
          $block = ($acl -split "\r?\n\r?\n" | Where-Object { $_ -match ':47823/' } | Select-Object -First 1)
          $sddlMatch = [regex]::Match($block, 'SDDL:\s*(\S+)')
          $actualSddl = if ($sddlMatch.Success) { (New-Object System.Security.AccessControl.RawSecurityDescriptor($sddlMatch.Groups[1].Value)).GetSddlForm('All') } else { '' }
          $expectedSddl = (New-Object System.Security.AccessControl.RawSecurityDescriptor("D:(A;;GX;;;$sid)")).GetSddlForm('All')
          if ($actualSddl -ne $expectedSddl) { Write-Host "47823 reservation:"; Write-Host $block; Write-Host "expected SDDL: $expectedSddl"; throw 'URL ACL must scope the installing user SID' }
          Write-Output "firewall shape: TCP System/47823/Private/LocalSubnet, UDP exe/Private/LocalSubnet, ACL user SID - verified"
          # Negative-hook test on the SHIPPED binary (round-6 G6): even with the capture
          # env switch set, the shipped exe has no ci-capture-token compiled in, so the
          # hook token must be rejected like any other unknown token.
          $config = Join-Path $env:APPDATA 'ZephyrPlayer'
          New-Item -ItemType Directory -Force $config | Out-Null
          [IO.File]::WriteAllText((Join-Path $config 'paired.json'), '["local-smoke-token"]')
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $psi = [System.Diagnostics.ProcessStartInfo]::new($installed)
          $psi.UseShellExecute = $false
          $psi.Environment['ZEPHYR_CI_CAPTURE'] = '1'
          $neg = [System.Diagnostics.Process]::Start($psi)
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer local-smoke-token' } -TimeoutSec 2 -UseBasicParsing
              $ok = ($r.StatusCode -eq 200)
            } catch {}
          }
          if (-not $ok) { throw 'shipped exe never answered with its real paired token' }
          $negCode = 0
          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:47823/control/status' -Headers @{ Authorization = 'Bearer ci-capture-token' } -TimeoutSec 3 -UseBasicParsing
            $negCode = [int]$r.StatusCode
          } catch { if ($_.Exception.Response) { $negCode = [int]$_.Exception.Response.StatusCode } }
          if ($negCode -ne 401) { throw "NEGATIVE HOOK FAILED: shipped exe answered ci-capture-token with $negCode, expected 401" }
          Write-Output 'NEGATIVE HOOK: PASS - shipped exe rejects ci-capture-token even with ZEPHYR_CI_CAPTURE=1'
          $neg.Kill()
          Start-Sleep -Seconds 2
          # The installer's runasoriginaluser auto-launch can take a while (or
          # not fire headless); poll first, direct-launch as fallback. A
          # mutex-handoff exit (second instance yields to the first) is FINE:
          # the verdict is "a ZephyrPlayer process is alive", not "my launch
          # survived".
          $alive = $false
          for ($i = 0; $i -lt 30 -and -not $alive; $i++) {
            Start-Sleep -Seconds 1
            $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)
          }
          if (-not $alive) {
            Write-Output "auto-launch did not produce a running app; launching installed exe directly"
            Start-Process $installed
            for ($i = 0; $i -lt 30 -and -not $alive; $i++) {
              Start-Sleep -Seconds 1
              $alive = [bool](Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)
            }
          }
          if (-not $alive) {
            $cl = Join-Path $env:TEMP 'ZephyrPlayer-crash.log'
            if (Test-Path $cl) { Write-Host "app crash log:"; Get-Content $cl }
            throw "installed exe never stayed running (startup/update-check crash or auto-launch dead)"
          }
          # Stay alive through the on-open update check window.
          Start-Sleep -Seconds 6
          if (-not (Get-Process ZephyrPlayer -ErrorAction SilentlyContinue)) {
            $cl = Join-Path $env:TEMP 'ZephyrPlayer-crash.log'
            if (Test-Path $cl) { Write-Host "app crash log:"; Get-Content $cl }
            throw "installed exe died during the update-check window"
          }
          Write-Output "installed exe alive through launch + on-open update check window"
          Get-Process ZephyrPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Emulate updater handoff: app exits, installer replaces installed files,
          # then relaunches. No release/tag is published for this local smoke.
          $config = Join-Path $env:APPDATA 'ZephyrPlayer'
          New-Item -ItemType Directory -Force $config | Out-Null
          $settingsPath = Join-Path $config 'settings.json'
          $pairingPath = Join-Path $config 'paired.json'
