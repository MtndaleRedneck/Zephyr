name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'scripts/pc_desktop_capture.ps1'
      - 'scripts/vlc_http_proof.ps1'
      - 'scripts/range_server.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# Windows player: build, tests, real-VLC proof, installer, desktop captures.
# Runs only when Windows-side files change.

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Zephyr Player
        run: dotnet build windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release
      - name: PlaybackServer loopback tests (auth mandatory, payload parse)
        run: dotnet test windows/ZephyrPlayer.Tests/ZephyrPlayer.Tests.csproj -c Release
      # Tests land with the first test project; installer job lands with
      # installer.iss; the airspace overlay still needs on-hardware validation.
      - name: Real VLC network playback proof (phone->VLC route)
        shell: pwsh
        run: scripts/vlc_http_proof.ps1
      - name: Publish single-file exe
        run: dotnet publish windows/ZephyrPlayer/ZephyrPlayer.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o windows/out
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = (Select-Xml -Path windows/ZephyrPlayer/ZephyrPlayer.csproj -XPath "//Version").Node.InnerText
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Real-desktop capture of the actual exe (full window + chrome)
        if: always()
        shell: pwsh
        run: scripts/pc_desktop_capture.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-evidence
          path: |
            ${{ runner.temp }}/pair-banner-render.png
            ${{ runner.temp }}/pc-controlbar-render.png
            ${{ runner.temp }}/pc-desktop.png
            ${{ runner.temp }}/pc-desktop-controls.png
            ${{ runner.temp }}/pc-desktop-settings.png
            ${{ runner.temp }}/pc-desktop-playing.png
            ${{ runner.temp }}/pc-desktop-note.txt
          if-no-files-found: warn
      # Private CI artifact only - no release/publish job (distribution undecided).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZephyrPlayer-installer
          path: windows/Output/ZephyrPlayer-*.exe
          if-no-files-found: warn

