name: android-signed-smoke
# workflow_dispatch only. Two stages, no secret, no signing key, no signed file ever uploaded anywhere.
#  build: builds the UNSIGNED release APK and keeps it as a run artifact named unsigned-apk (1 day retention).
#         The owner's runner downloads it, deletes the artifact, and signs it locally from the vault.
#  smoke: the owner passes only the APK Signing Block (public certificate + signature, about 5 KB, no secret)
#         as base64. This job takes the unsigned APK from the build run, inserts the block (scripts/sigblock.py),
#         requires the result to hash to the exact signed file the owner holds, then installs the published 1.4.0
#         and the signed file over it on an emulator and checks the resumed app UI.
#         The signed APK exists only on this runner. A final always() job deletes the unsigned artifact.
# Nothing here publishes a release.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'build or smoke'
        required: true
        default: 'build'
      build_run_id:
        description: 'smoke: id of the build run that holds the unsigned-apk artifact'
        required: false
      unsigned_sha256:
        description: 'smoke: sha256 of the unsigned APK'
        required: false
      signing_block_b64:
        description: 'smoke: base64 APK signing block (public data)'
        required: false
      expected_signed_sha256:
        description: 'smoke: sha256 of the locally signed APK'
        required: false
      expected_signer_sha256:
        description: 'smoke: signer certificate sha256 (the published 1.4.0 signer)'
        required: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.stage == 'build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - name: Build the unsigned release
        run: ./gradlew --no-daemon assembleRelease
      - name: Check the unsigned APK is zipaligned (signing must not move entries)
        run: |
          set -e
          APK=$(ls android/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 4 "$APK" || "$BT/zipalign" -c -p 4 "$APK"
          cp "$APK" "$RUNNER_TEMP/unsigned.apk"
          echo "unsigned sha256: $(sha256sum "$RUNNER_TEMP/unsigned.apk" | cut -d' ' -f1)"
          echo "source: $GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned.apk
          retention-days: 1
          if-no-files-found: error
  smoke:
    if: ${{ inputs.stage == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rebuild the exact signed bytes and verify them
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          WANT_UNSIGNED: ${{ inputs.unsigned_sha256 }}
          BLOCK_B64: ${{ inputs.signing_block_b64 }}
          WANT_SIGNED: ${{ inputs.expected_signed_sha256 }}
          WANT_SIGNER: ${{ inputs.expected_signer_sha256 }}
        run: |
          set -e
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id"; exit 1; }
          for v in "$WANT_UNSIGNED" "$WANT_SIGNED" "$WANT_SIGNER"; do [[ "$v" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256 input"; exit 1; }; done
          [[ "$BLOCK_B64" =~ ^[A-Za-z0-9+/=]{100,20000}$ ]] || { echo "bad signing block input"; exit 1; }
          mkdir -p /tmp/zs && cd /tmp/zs
          RUN_REPO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.repository.full_name + " " + .name')
          echo "build run: $RUN_REPO"
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="unsigned-apk" and (.expired|not)) | .id')
          [ -n "$AID" ] || { echo "unsigned-apk artifact not found or expired"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > u.zip
          unzip -q u.zip && mv unsigned.apk unsigned.bin
          [ "$(sha256sum unsigned.bin | cut -d' ' -f1)" = "$WANT_UNSIGNED" ] || { echo "ASSERT FAIL: unsigned APK hash differs"; exit 1; }
          printf '%s' "$BLOCK_B64" | base64 -d > block.bin
          python3 "$GITHUB_WORKSPACE/scripts/sigblock.py" apply unsigned.bin block.bin new.apk
          H=$(sha256sum new.apk | cut -d' ' -f1)
          echo "rebuilt signed sha256: $H"
          [ "$H" = "$WANT_SIGNED" ] || { echo "ASSERT FAIL: rebuilt signed APK is not the owner's signed file"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs new.apk | tee new.certs
          curl -sfL -o old.apk https://github.com/MtndaleRedneck/Zephyr/releases/download/zephyr-android-v1.4.0/Zephyr-Android-1.4.0.apk
          "$BT/apksigner" verify --print-certs old.apk | tee old.certs
          grep -i 'SHA-256 digest' new.certs | head -1 | grep -qi "$WANT_SIGNER" || { echo "ASSERT FAIL: new signer differs"; exit 1; }
          grep -i 'SHA-256 digest' old.certs | head -1 | grep -qi "$WANT_SIGNER" || { echo "ASSERT FAIL: 1.4.0 signer differs"; exit 1; }
          echo "ok: exact signed bytes rebuilt, same signer as the published 1.4.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
      - name: Upgrade 1.4.0 to the exact signed build on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          script: |
            while [ "$(adb shell service check package 2>/dev/null | tr -d '\r')" != "Service package: found" ]; do sleep 5; done
            adb shell settings put global verifier_verify_adb_installs 0
            adb install -r /tmp/zs/old.apk
            adb shell dumpsys package com.zephyr.remote | grep -E 'versionName|versionCode' | head -2
            adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard
            adb shell monkey -p com.zephyr.remote -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.zephyr.remote
            adb shell am force-stop com.zephyr.remote
            adb install -r /tmp/zs/new.apk
            adb shell dumpsys package com.zephyr.remote | grep -E 'versionName|versionCode' | head -2 | tee /tmp/zs/after.txt
            grep -q 'versionName=1.5.0' /tmp/zs/after.txt
            adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard
            adb shell monkey -p com.zephyr.remote -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell pidof com.zephyr.remote
            adb shell dumpsys activity activities | grep -E "ResumedActivity" | tee /tmp/zs/resumed.txt
            grep -q "com.zephyr.remote/" /tmp/zs/resumed.txt
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null && adb shell cat /sdcard/ui.xml > /tmp/zs/ui.xml
            grep -q 'package="com.zephyr.remote"' /tmp/zs/ui.xml
            echo "ui nodes from the app: $(grep -o 'package="com.zephyr.remote"' /tmp/zs/ui.xml | wc -l)"
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*com.zephyr.remote'
            echo "ok: exact signed 1.5 installed over 1.4.0, resumed activity and app UI present, no fatal exception"
  cleanup:
    if: ${{ always() && inputs.stage == 'smoke' }}
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the unsigned artifact of the build run (also on failure)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 0
          for a in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$a" && echo "deleted artifact $a"
          done
