# CodeQL security scan - C# variant. build-mode none (buildless) is supported for C#.
# Real dotnet build + tests stay in the existing windows workflow; this is additive.
name: CodeQL (C#)

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'   # weekly, Tuesday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-verified 2026-11-23)

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
