name: Android recovery verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Exact BingeMote repair source
        run: |
          git clone https://github.com/MtndaleRedneck/BingeMote.git /tmp/binge
          git -C /tmp/binge checkout 33a357721089634f593d3d0c0766a4846a3a6873
      - name: Local suites and release candidates
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bingemote
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease
          (cd /tmp/binge && ./gradlew --no-daemon testDebugUnitTest -PrecoveryReleaseTest assembleRelease assembleReleaseAndroidTest)
          rm -f "$RUNNER_TEMP/release.keystore"
          curl -fL https://github.com/MtndaleRedneck/BingeMote/releases/download/android-v1.11.1/BingeMote-Android-1.11.1.apk -o /tmp/original.apk
          curl -fL https://github.com/MtndaleRedneck/Zephyr-Dev/releases/download/android-v1.0.0/Zephyr-Android-1.0.0.apk -o /tmp/faulty.apk
          echo '4a79fa88e8f454c3afe7f9536005e25128cb2f0ce61ef17a23c33bd2c39ba376  /tmp/original.apk' | sha256sum -c
          echo '1edcb62be91cab43fb38fb67a417d5ed54ea191c1e5f63ce3db629a628cbe615  /tmp/faulty.apk' | sha256sum -c
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/recovery-proof.sh
      - name: Encrypt signed candidates before upload
        if: always()
        run: |
          mkdir -p sealed
          if [ -f android/build/outputs/apk/release/app-release.apk ]; then
            tar -czf /tmp/candidates.tar.gz android/build/outputs/apk/release/app-release.apk -C /tmp/binge app/build/outputs/apk/release/app-release.apk
            openssl rand -out /tmp/transport.key 32
            openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/candidates.tar.gz -out sealed/candidates.enc -pass file:/tmp/transport.key
            openssl pkeyutl -encrypt -certin -inkey scripts/candidate-public.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/transport.key -out sealed/key.enc
            sha256sum android/build/outputs/apk/release/app-release.apk /tmp/binge/app/build/outputs/apk/release/app-release.apk > sealed/SHA256SUMS
            rm -f /tmp/transport.key /tmp/candidates.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-evidence
          path: |
            screenshots/*
            instrument-results/*
            sealed/*
          retention-days: 2
